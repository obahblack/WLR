const { useState, useEffect, useRef } = React;

const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2 }) => (
  <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap, height: size }}>
    {[0.66, 1, 0.82].map((h, i) => (
      <span key={i} style={{ width: size * 0.22, height: `${h * 100}%`, background: color }} />

const Kick = ({ children, style = {} }) => (
  <div style={{ fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.24em', textTransform: 'uppercase', opacity: .55, marginBottom: 18, ...style }}>{children}</div>
);

const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: amount, rootMargin: '0px 0px -10% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const navigateTo = (v) => { window.dispatchEvent(new CustomEvent('wlr-nav', { detail: v })); window.scrollTo({ top: 0, behavior: 'instant' }); };

const HUD = ({ view }) => (
  <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100, mixBlendMode: 'difference', pointerEvents: 'none', padding: '22px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: '#FFF', fontFamily: 'Geist', fontSize: 13, letterSpacing: '.02em' }}>
    <a href="#" onClick={(e) => { e.preventDefault(); navigateTo('home'); }} style={{ pointerEvents: 'auto', display: 'inline-flex', alignItems: 'center', gap: 10, color: '#FFF', textDecoration: 'none', fontWeight: 500 }}>

    </a>
    <span style={{ pointerEvents: 'auto', display: 'flex', gap: 24, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase' }}>
      {[['Work','work'],['About','about'],['Team','team']].map(([l, v]) => (
        <a key={v} href="#" onClick={(e) => { e.preventDefault(); navigateTo(v); }} style={{ color: '#FFF', textDecoration: 'none', opacity: view === v ? 1 : .5 }}>{l}</a>
      ))}
      <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ color: '#FFF', textDecoration: 'none', cursor: 'pointer', fontWeight: 500 }}>Get a quote</a>
    </span>
  </div>
);

/* page index — vertical editorial number rail */
const PageIndex = ({ marks }) => {
  const [p, setP] = useState(0);
  useEffect(() => {
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setP(h > 0 ? window.scrollY / h : 0);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  const active = Math.min(marks.length - 1, Math.floor(p * marks.length));
  return (
    <div style={{ position: 'fixed', right: 30, top: '50%', transform: 'translateY(-50%)', zIndex: 90, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, mixBlendMode: 'difference', color: '#FFF', fontFamily: 'Geist', fontSize: 11 }}>
      {marks.map((m, i) => (
        <span key={m} style={{ opacity: i === active ? 1 : .3, transition: 'opacity .3s ease', transform: i === active ? 'scale(1.25)' : 'none' }}>{m}</span>
      ))}
    </div>
  );
};

/* 01 · Hero — clip-path line reveal on boot, scroll-scrub mono strip */

/* 02 · Sell/Deliver — editorial pull-quote swap with rule tracking */
const SellDeliver = () => {
  const sectionRef = useRef(null);
  const [p, setP] = useState(0);
  const [flip, setFlip] = useState(false);
  const ruleRef = useRef(null);
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0, lastFlip = null;
    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const prog = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));
      setP(prog);
      if (ruleRef.current) ruleRef.current.style.width = `${Math.min(100, (prog / 0.5) * 100)}%`;
      const f = prog > 0.5;
      if (f !== lastFlip) { lastFlip = f; setFlip(f); }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  return (
    <section ref={sectionRef} style={{ height: '300vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: flip ? '#FFF' : '#000', transition: 'background .55s ease', color: flip ? '#000' : '#FFF', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 6vw' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.24em', textTransform: 'uppercase', opacity: .55 }}>
            <span>Vol. 02 — Two words</span><span>{Math.round(p * 100)}</span>
          </div>
          <h2 style={{ margin: '40px 0 0', fontFamily: 'Geist', fontSize: 'clamp(80px, 16vw, 240px)', fontWeight: 500, letterSpacing: '-.05em', lineHeight: 1, transition: 'all .35s ease' }}>
            {flip ? (
              <span>We <i style={{ fontSize: '0.5em', verticalAlign: 'baseline' }}>deliver.</i></span>
            ) : (
              <span>You <i style={{ fontSize: '0.5em', verticalAlign: 'baseline' }}>sell.</i></span>
            )}
          </h2>
          <div style={{ marginTop: 48, height: 1, background: 'currentColor', opacity: .25, position: 'relative' }}>
            <div ref={ruleRef} style={{ position: 'absolute', left: 0, top: -1, height: 3, background: 'currentColor', width: 0, transition: 'width .1s linear' }} />
          </div>
          <p style={{ marginTop: 26, maxWidth: 620, fontSize: 'clamp(15px, 1.15vw, 18px)', lineHeight: 1.65, opacity: .7 }}>
            You own the relationship, the pitch and the invoice. We run production behind the scenes — on your templates, in your voice, to your deadlines. Your clients never learn our name, and that is the entire point.
          </p>
        </div>
      </div>
    </section>
  );
};

/* 04 · Positioning — sticky, word-scrub editorial line */
const Positioning = () => {
  const sectionRef = useRef(null);
  const wordRefs = useRef([]);
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    const words = wordRefs.current.filter(Boolean);
    if (!words.length) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const vh = window.innerHeight;
      for (let i = 0; i < words.length; i++) {
        const r = words[i].getBoundingClientRect();
        const center = r.top + r.height / 2;
        const pr = Math.max(0, Math.min(1, 1 - (center - vh * 0.3) / (vh * 0.5)));
        words[i].style.opacity = 0.15 + pr * 0.85;
      }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  const l1 = 'Hiring a specialist for every discipline is slow and expensive.';
  const l2 = 'Renting a full bench is neither.';
  const line = (txt, off) => txt.split(' ').map((w, i) => <span key={i} ref={el => wordRefs.current[off + i] = el} style={{ display: 'inline-block', opacity: 0.15, marginRight: '0.28em' }}>{w}</span>);
  return (
    <section ref={sectionRef} style={{ background: '#000', color: '#FFF', padding: '150px 6vw', borderTop: '1px solid #FFF' }}>
      <Kick>Vol. 04 — Why partner</Kick>
      <div style={{ fontFamily: 'Geist', fontSize: 'clamp(36px, 6vw, 96px)', fontWeight: 500, letterSpacing: '-.04em', lineHeight: 1.08 }}>
        <div>{line(l1, 0)}</div>
        <div style={{ marginTop: 16 }}>{line(l2, l1.split(' ').length)}</div>
      </div>
    </section>
  );
};

/* 07 · Before/After — two big numerals, editorial half-split */
const BeforeAfter = () => {
  const [ref, seen] = useReveal(.3);

  ['Nathaniel Duku', 'Jr Client Success Manager'],
];

const TeamHero = () => {
  const [ref, seen] = useReveal(0.15);
  const [hover, setHover] = useState(false);
  return (
    <section ref={ref} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ minHeight: '90vh', background: hover ? '#FFF' : '#000', color: hover ? '#000' : '#FFF', transition: 'background .55s ease, color .55s ease', padding: '150px 6vw 80px', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <Kick>Vol. T — The roster</Kick>
      <h1 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(56px, 9vw, 156px)', fontWeight: 500, letterSpacing: '-.05em', lineHeight: 0.9, clipPath: seen ? 'inset(0 0 0 0)' : 'inset(0 100% 0 0)', transition: 'clip-path 1s cubic-bezier(.2,.8,.2,1) .1s' }}>The people who<br /><i>never take credit.</i></h1>
      <p style={{ marginTop: 30, maxWidth: 560, fontSize: 15.5, lineHeight: 1.65, opacity: .7 }}>Strategists, designers, engineers and writers working across four time zones — shipped entirely under your brand.</p>
    </section>
  );
};

const TeamGrid = () => {
  const [ref, seen] = useReveal(0.1);
  return (
    <section ref={ref} style={{ background: '#000', color: '#FFF', padding: '120px 6vw', borderTop: '1px solid #FFF' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 24, marginBottom: 48 }}>
        <div><Kick>Vol. T1 — The names</Kick><h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(40px,5.4vw,84px)', fontWeight: 500, letterSpacing: '-.04em', lineHeight: 1 }}>The full bench.</h2></div>
        <p style={{ margin: 0, maxWidth: 360, fontSize: 15, lineHeight: 1.6, opacity: .65 }}>No logos on the work, no bylines on the deliverables. Every project ships under your brand — the names stay here.</p>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
        {TEAM.map((m, i) => {
          const inv = i % 2 === 1;
          return (
            <div key={m[0]} style={{ borderTop: '1px solid #FFF', padding: '18px 0', display: 'flex', flexDirection: 'column', opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(22px)', transition: `opacity .5s ease ${(i % 4) * 90}ms, transform .6s cubic-bezier(.2,.8,.2,1) ${(i % 4) * 90}ms` }}>
              <div style={{ aspectRatio: '1 / 1', display: 'grid', placeItems: 'center', background: inv ? '#FFF' : 'transparent', color: inv ? '#000' : '#FFF', marginBottom: 16 }}>
                <ThreeBar size={40} color="currentColor" gap={4} />
              </div>
              <div style={{ fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.16em', opacity: .5, marginBottom: 6 }}>№ {String(i + 1).padStart(2, '0')}</div>
              <div style={{ fontFamily: 'Geist', fontSize: 'clamp(16px,1.3vw,21px)', fontWeight: 500, letterSpacing: '-.015em', lineHeight: 1.15 }}>{m[0]}</div>
              <div style={{ marginTop: 6, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', opacity: .55 }}>{m[1]}</div>
            </div>
          );
        })}
      </div>
    </section>
  );
};

const Team = () => (
  <React.Fragment>
    <TeamHero />
    <TeamGrid />
    <CTA />
  </React.Fragment>
);

/* ════════════ CTA + QUOTE + FOOTER ════════════ */
const CTA = () => {
  const [ref, seen] = useReveal(0.2);
  return (
    <section ref={ref} style={{ background: '#000', color: '#FFF', borderTop: '1px solid #FFF', padding: 'clamp(90px, 11vw, 150px) 6vw', textAlign: 'center', opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(24px)', transition: 'opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1)' }}>
      <Kick style={{ justifyContent: 'center', display: 'flex' }}>Vol. End — Next</Kick>
      <h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(48px, 7vw, 112px)', fontWeight: 500, letterSpacing: '-0.045em', lineHeight: 0.9 }}>Ready to build<br />under your brand?</h2>
      <p style={{ margin: '24px auto 0', maxWidth: 420, fontSize: 15.5, lineHeight: 1.6, opacity: .7 }}>Tell us about your pipeline. We reply within one business day.</p>
      <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ marginTop: 40, display: 'inline-flex', alignItems: 'center', gap: 14, padding: '20px 30px', background: '#FFF', color: '#000', cursor: 'pointer', fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em', textTransform: 'uppercase', textDecoration: 'none' }}><ThreeBar size={13} color="#000" />Get a quote</a>
    </section>
  );
};

const QuoteModal = () => {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);
  if (!open) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div onClick={() => setOpen(false)} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,.55)' }} />
      <div style={{ position: 'relative', width: '90vw', maxWidth: 640, maxHeight: '90vh', overflow: 'auto' }}>
        <button onClick={() => setOpen(false)} style={{ position: 'fixed', top: 20, right: 24, zIndex: 2, background: '#FFF', border: 'none', color: '#000', cursor: 'pointer', fontFamily: 'Geist Mono', fontSize: 14, lineHeight: 1, padding: '8px 12px' }}>✕</button>
        <iframe src="quote-v1.html" title="Get a Quote" style={{ width: '100%', height: '85vh', border: 'none' }} />
      </div>
    </div>
  );
};

const Footer = () => (
  <footer style={{ background: '#000', color: '#FFF', borderTop: '1px solid #FFF', padding: '52px 6vw 34px' }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 28 }}>
      <div>
        <ThreeBar size={20} color="#FFF" gap={3} />
        <div style={{ marginTop: 14, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.22em', textTransform: 'uppercase', opacity: .55 }}>© 2026 White Label Resell · est. 2018</div>
      </div>
      <div style={{ display: 'flex', gap: 22, flexWrap: 'wrap', fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.2em', textTransform: 'uppercase' }}>
        {[['Work','work'],['About','about'],['Team','team']].map(([l, v]) => <a key={v} href="#" onClick={(e) => { e.preventDefault(); navigateTo(v); }} style={{ textDecoration: 'none', opacity: .75 }}>{l}</a>)}
        <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ textDecoration: 'none', opacity: .75, cursor: 'pointer' }}>Get a Quote</a>
        <a href="mailto:partners@whitelabelresell.com" style={{ textDecoration: 'none', opacity: .75 }}>partners@whitelabelresell.com</a>
      </div>
    </div>
  </footer>
);

const App = () => {
  const [view, setView] = useState('home');
  useEffect(() => {
    const onNav = (e) => setView(e.detail);
    window.addEventListener('wlr-nav', onNav);
    return () => window.removeEventListener('wlr-nav', onNav);
  }, []);
  return (
    <React.Fragment>
      <QuoteModal />
      <HUD view={view} />
      {view === 'home' && <PageIndex marks={['1','2','3','4','5','6','7','8','9']} />}
      {view === 'home' && <Home />}
      {view === 'work' && <Work />}
      {view === 'about' && <About />}
      {view === 'team' && <Team />}
      <Footer />
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
