<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>White Label Resell — White-label SEO, content, web &amp; analytics for agencies</title>
<meta name="description" content="White Label Resell is the production bench behind agencies. SEO, content, web development, paid media and analytics delivered under your brand." />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { overflow-x: clip; }
  html, body { margin: 0; padding: 0; background: #000; color: #FFF; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  h1, h2, h3 { text-wrap: pretty; }
  ::selection { background: #FFF; color: #000; }

  body::-webkit-scrollbar { width: 0; }
  @keyframes pulseDot { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.3; transform: scale(.7); } }
  @keyframes marqueeFwd { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }
  @keyframes marqueeRev { from { transform: translateX(-33.333%); } to { transform: translateX(0); } }
  /* Reduced-motion override removed — animations play on all devices */
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;
gsap.registerPlugin(ScrollTrigger);

/* ── mark ─────────────────────────────────────────── */
const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2, animate = false, barWidth = null }) => {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!animate) return;
    let r;
    const tick = () => { setT(x => x + 0.016); r = requestAnimationFrame(tick); };
    r = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(r);
  }, [animate]);
  const base = [0.66, 1, 0.82];
  const heights = animate ? base.map((h, i) => h * (0.7 + 0.3 * Math.sin(t * 1.0 + i * 1.2))) : base;
  const w = barWidth || size * 0.22;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap, height: size }}>
      {heights.map((h, i) => (
        <span key={i} style={{ width: w, height: `${h * 100}%`, background: color }} />
      ))}
    </span>
  );
};

/* ── scroll hooks ─────────────────────────────────────
   useReveal: fires once, only when the element is genuinely
   on screen (15% inset), so nothing animates off-viewport.
   useProgress: 0→1 as the element travels through the viewport,
   so any motion driven by it is locked to the scrollbar.       */
const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } },
      { threshold: amount, rootMargin: '0px 0px -12% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const useProgress = () => {
  const ref = useRef(null);
  const [p, setP] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0, trail = 0;
    const measure = () => {
      raf = 0;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      setP(span <= 0
        ? Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)))
        : Math.max(0, Math.min(1, -r.top / span)));
    };
    const onScroll = () => {
      // measure on a rAF tick, then always re-measure on the trailing edge
      // so the final coalesced scroll event is never dropped
      if (!raf) raf = requestAnimationFrame(measure);
      clearTimeout(trail);
      trail = setTimeout(measure, 90);
    };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(trail);
    };
  }, []);
  return [ref, p];
};

/* ── chrome ───────────────────────────────────────── */
const HUD = () => (
  <div style={{
    position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
    mixBlendMode: 'difference', pointerEvents: 'none',
    padding: '20px 32px', display: 'flex', justifyContent: 'space-between',
    alignItems: 'center', color: '#FFF',
    fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase',
  }}>
    <a href="index.html" style={{ pointerEvents: 'auto', display: 'inline-flex', alignItems: 'center', gap: 12, color: '#FFF', textDecoration: 'none' }}>
      <ThreeBar size={14} color="#FFF" gap={3} />White Label Resell
    </a>
    <span style={{ pointerEvents: 'auto', display: 'flex', gap: 24 }}>
      <a href="work-variations/work-v6.html" style={{ color: '#FFF', textDecoration: 'none' }}>Work</a>
      <a href="about-variations/about-v1.html" style={{ color: '#FFF', textDecoration: 'none' }}>About</a>
      <a href="team-v2.html" style={{ color: '#FFF', textDecoration: 'none' }}>Team</a>
      <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ color: '#FFF', textDecoration: 'none', cursor: 'pointer' }}>Get a Quote</a>
    </span>
  </div>
);

const Kick = ({ children, style = {} }) => (
  <div style={{
    fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em',
    textTransform: 'uppercase', opacity: .6, marginBottom: 16, ...style,
  }}>{children}</div>
);

/* ═══ 01 · HERO — white, no inversion ═══ */
const Hero = () => {
  const [loaded, setLoaded] = useState(false);
  const sectionRef = useRef(null);
  const barsRef = useRef([]);
  const contentRef = useRef(null);
  const barsWrapRef = useRef(null);
  const [barsH, setBarsH] = useState(0);

  useEffect(() => {
    const t = setTimeout(() => setLoaded(true), 100);
    return () => clearTimeout(t);
  }, []);

  // Measure text content height and apply to bars container
  useLayoutEffect(() => {
    const wrap = barsWrapRef.current;
    const content = contentRef.current;
    if (!wrap || !content) return;
    const measure = () => {
      const h = content.offsetHeight;
      if (h > 0) {
        wrap.style.height = h + 'px';
        setBarsH(h);
      }
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [loaded]);

  useLayoutEffect(() => {
    if (!loaded || !barsH) return;
    const ctx = gsap.context(() => {
      // Only the initial page-load entrance animation for bars
      gsap.fromTo(barsRef.current, { scaleY: 0 }, {
        scaleY: 1, duration: 1.2, stagger: 0.12, ease: 'power3.out'
      });
      gsap.fromTo(contentRef.current.children, { y: 40, opacity: 0 }, {
        y: 0, opacity: 1, duration: 1.2, stagger: 0.15, ease: 'power3.out', delay: 0.2
      });
    }, sectionRef);
    return () => ctx.revert();
  }, [loaded, barsH]);

  // Continuous breathing animation — starts after entrance completes
  useEffect(() => {
    if (!loaded || !barsH) return;
    const durations = [3.8, 4.5, 3.2];
    const scales = [0.85, 1.0, 0.92];
    const timers = barsRef.current.map((bar, i) => {
      if (!bar) return null;
      const targetScale = scales[i];
      return gsap.fromTo(bar,
        { scaleY: targetScale },
        {
          scaleY: targetScale * 0.85,
          duration: durations[i] * 0.5,
          ease: 'sine.inOut',
          repeat: -1,
          yoyo: true,
          delay: 1.4 + i * 0.4,
        }
      );
    });
    return () => timers.forEach(t => t && t.kill());
  }, [loaded, barsH]);

  return (
    <section
      ref={sectionRef}
      style={{
        minHeight: '100vh', background: '#FFF', color: '#000',
        display: 'flex', alignItems: 'center',
        padding: '140px 6vw 80px',
      }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '4vw', width: '100%' }}>
        {/* Text content — auto height, grows naturally */}
        <div ref={contentRef} style={{ flex: 1 }}>
          <Kick style={{ opacity: .6 }}>White-label production · est. 2018</Kick>
          <h1 style={{
            margin: 0, fontFamily: 'Geist',
            fontSize: '94px',
            fontWeight: 500, letterSpacing: '-.04em', lineHeight: 1.04,
          }}>
            We Build What<br />
            Moves<br />
            <i style={{ fontWeight: 300 }}>Business forward</i>
          </h1>
          <p style={{
            margin: '32px 0 0',
            maxWidth: 'calc(94px * 7.2)',
            fontSize: 'clamp(16px, 1.25vw, 19px)', lineHeight: 1.6, opacity: .8,
          }}>
            SEO, content, web development, paid media and analytics — built and shipped
            under your agency&apos;s brand. You keep the client, the credit and the margin.
          </p>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 40 }}>
            <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{
              display: 'inline-flex', alignItems: 'center', gap: 12, padding: '18px 26px',
              background: 'currentColor', textDecoration: 'none',
              fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em',
              textTransform: 'uppercase', fontWeight: 600, cursor: 'pointer',
            }}>
              <span style={{ color: '#FFF', display: 'inline-flex', alignItems: 'center', gap: 12 }}>
                <ThreeBar size={12} color="#FFF" />Get a quote
              </span>
            </a>
            <a href="work-variations/work-v6.html" style={{
              display: 'inline-flex', alignItems: 'center', padding: '18px 26px',
              border: '1px solid currentColor', textDecoration: 'none',
              fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em', textTransform: 'uppercase',
            }}>See the work →</a>
          </div>
        </div>
        {/* Bars — height matches text content, bottom-aligned */}
        <div ref={barsWrapRef} style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'flex-end', gap: 32, flexShrink: 0 }}>
          {[0.7, 1, 0.85].map((h, i) => (
            <div key={i} ref={el => barsRef.current[i] = el} style={{
              width: 'clamp(70px, 9vw, 160px)',
              height: `${h * 100}%`,
              background: 'currentColor',
              transformOrigin: 'bottom center',
            }} />
          ))}
        </div>
      </div>
    </section>
  );
};

/* ═══ 02+04 · SELL/DELIVER + SERVICES — unified horizontal track ═══
   SellDeliver (left) and Services heading (right, off-screen) sit on the
   same horizontal plane. Scroll drives: wipe → horizontal slide → black
   wipe → heading shrink → cards. No vertical scroll until cards.          */
const SellDeliver = () => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const sdStageRef = useRef(null);
  const barRefs = [useRef(null), useRef(null), useRef(null)];
  const sdHeadingRef = useRef(null);
  const pctRef = useRef(null);
  const svcHeadingRef = useRef(null);
  const svcSubtextRef = useRef(null);
  const svcCardsRef = useRef(null);
  const svcSubtextWrapRef = useRef(null);
  const svcCardsWrapRef = useRef(null);
  const headingSnapped = useRef(false);
  const wipeRef = useRef(null);
  const cardsRef = useRef([]);

  const items = [
    { name: 'Design', desc: 'UI/UX design, product design, wireframes, brand direction, Figma prototypes — from concept to handoff.', services: ['UI/UX Design', 'Product Design', 'Wireframes & Prototypes', 'Brand Direction'] },
    { name: 'Development', desc: 'Web development, product builds, WordPress, Shopify, custom applications and CRM systems — from spec to scale.', services: ['Web Development', 'Product Development', 'WordPress & Shopify', 'Custom Applications'] },
    { name: 'Marketing', desc: 'SEO, paid search, paid social, email marketing, content production — from strategy to conversion.', services: ['SEO & Content', 'Paid Search & Social', 'Email Marketing', 'Local SEO & Links'] },
    { name: 'Analytics', desc: 'GA4, Tag Manager, Looker Studio reporting, data insights, conversion tracking — from data to decisions.', services: ['GA4 & Tag Manager', 'Looker Studio', 'Conversion Tracking', 'Data Insights'] },
  ];

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0, lastFlip = null, lastPct = null;

    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));

      /* ─── Phase 1 (0→0.45): SellDeliver wipe bars + flip ─── */
      const sdP = Math.min(1, p / 0.45);
      for (let i = 0; i < 3; i++) {
        const start = .10 + i * .12, end = start + .34;
        const w = Math.max(0, Math.min(1, (sdP - start) / (end - start)));
        const el = barRefs[i].current;
        if (el) el.style.transform = `scaleX(${w})`;
      }
      const flip = sdP > .5;
      if (flip !== lastFlip) {
        lastFlip = flip;
        if (sdStageRef.current) {
          sdStageRef.current.style.backgroundColor = flip ? '#FFFFFF' : '#000000';
          sdStageRef.current.style.color = flip ? '#000000' : '#FFFFFF';
        }
        if (sdHeadingRef.current) {
          sdHeadingRef.current.textContent = flip ? 'We deliver.' : 'You sell.';
        }
      }
      const pct = String(Math.round(sdP * 100)).padStart(3, '0') + '%';
      if (pct !== lastPct && pctRef.current) { lastPct = pct; pctRef.current.textContent = pct; }

      /* ─── Phase 2 (0.45→0.65): horizontal slide — track moves left ─── */
      const slideP = Math.max(0, Math.min(1, (p - 0.45) / 0.20));
      const eased = 1 - Math.pow(1 - slideP, 3);
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-eased * 100}vw)`;

      /* ─── Phase 3 (0.60→0.80): black wipe on services — right → left ─── */
      const wipeP = Math.max(0, Math.min(1, (p - 0.60) / 0.20));
      if (wipeRef.current) wipeRef.current.style.clipPath = `inset(0 ${(1 - wipeP) * 100}% 0 0)`;

      /* ─── Phase 4 (0.72→0.84): heading shrinks to ~80px ─── */
      const shrinkP = Math.max(0, Math.min(1, (p - 0.72) / 0.12));
      if (svcHeadingRef.current) {
        if (shrinkP <= 0) {
          svcHeadingRef.current.style.fontSize = 'clamp(52px, 8.5vw, 148px)';
          headingSnapped.current = false;
        } else if (shrinkP >= 1) {
          svcHeadingRef.current.style.fontSize = '80px';
        } else {
          if (headingSnapped.current === false) {
            headingSnapped.current = parseFloat(getComputedStyle(svcHeadingRef.current).fontSize);
          }
          const orig = headingSnapped.current;
          svcHeadingRef.current.style.fontSize = `${orig + (80 - orig) * shrinkP}px`;
        }
      }

      /* ─── Phase 5 (0.82→0.94): subtext + cards expand and fade in ─── */
      const revealP = Math.max(0, Math.min(1, (p - 0.82) / 0.12));

      if (svcSubtextWrapRef.current) {
        svcSubtextWrapRef.current.style.maxHeight = revealP > 0 ? '200px' : '0';
        svcSubtextWrapRef.current.style.opacity = String(revealP * 0.7);
      }
      if (svcCardsWrapRef.current) {
        svcCardsWrapRef.current.style.maxHeight = revealP > 0 ? '2000px' : '0';
        svcCardsWrapRef.current.style.opacity = String(revealP);
      }

    };

    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', measure);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section ref={sectionRef} style={{ height: '500vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>

        {/* ── Horizontal track: SellDeliver | Services side by side ── */}
        <div ref={trackRef} style={{
          display: 'flex', width: '200vw', height: '100vh',
          willChange: 'transform',
        }}>
          {/* LEFT: SellDeliver */}
          <div ref={sdStageRef} style={{
            width: '100vw', height: '100vh', position: 'relative',
            backgroundColor: '#000', color: '#FFF',
            transition: 'background-color .6s ease-in-out, color .6s ease-in-out',
            flexShrink: 0,
          }}>
            {/* Wipe bars */}
            <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
              {[0, 1, 2].map(i => (
                <div key={i} ref={barRefs[i]} style={{
                  position: 'absolute', left: 0, right: 0,
                  top: i === 0 ? '18.5%' : i === 1 ? '41.5%' : '68.5%',
                  height: i === 1 ? '17%' : '13%',
                  backgroundColor: '#FFF',
                  transformOrigin: 'left center',
                  transform: 'scaleX(0)',
                  willChange: 'transform',
                  mixBlendMode: 'difference',
                }} />
              ))}
            </div>
            <div style={{
              position: 'absolute', top: 90, left: 32, right: 32,
              display: 'flex', justifyContent: 'space-between',
              fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em',
              textTransform: 'uppercase', opacity: .6, mixBlendMode: 'difference', color: '#FFF',
            }}>
              <span>The partnership, in two words</span>
              <span ref={pctRef}>000%</span>
            </div>
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              pointerEvents: 'none',
            }}>
              <h2 ref={sdHeadingRef} style={{
                margin: 0, textAlign: 'center', fontFamily: 'Geist',
                fontSize: 'clamp(67px, 14.5vw, 215px)', fontWeight: 500,
                letterSpacing: '-.045em', lineHeight: 1.08,
                color: '#FFF', mixBlendMode: 'difference',
              }}>You sell.</h2>
            </div>
            <p style={{
              position: 'absolute', bottom: 90, left: 32, right: 32, margin: 0,
              maxWidth: 620, fontSize: 'clamp(15px, 1.15vw, 18px)', lineHeight: 1.6, opacity: .75,
            }}>
              You own the relationship, the pitch and the invoice. We run production behind
              the scenes — on your templates, in your voice, to your deadlines. Your clients
              never learn our name, and that is the entire point.
            </p>
          </div>

          {/* RIGHT: Services — all content in one container */}
          <div style={{
            width: '100vw', height: '100vh', position: 'relative',
            flexShrink: 0,
          }}>
            {/* White background layer */}
            <div style={{
              position: 'absolute', inset: 0,
              background: '#FFF',
            }} />

            {/* Black wipe — clips right → left */}
            <div ref={wipeRef} style={{
              position: 'absolute', inset: 0, background: '#000',
              clipPath: 'inset(0 100% 0 0)',
              willChange: 'clip-path',
            }} />

            {/* Single content container: heading + subtext + cards */}
            <div style={{
              position: 'absolute', inset: 0,
              padding: '0 6vw',
              display: 'flex', flexDirection: 'column',
              justifyContent: 'center',
              pointerEvents: 'none',
            }}>
              {/* Heading — big during intro, shrinks via animation */}
              <h2 ref={svcHeadingRef} style={{
                margin: 0, fontFamily: 'Geist',
                fontSize: 'clamp(52px, 8.5vw, 148px)',
                fontWeight: 600, letterSpacing: '-.045em', lineHeight: 0.92,
                mixBlendMode: 'difference', color: '#FFF',
                willChange: 'transform',
              }}>
                Your full<br /><i style={{ fontWeight: 300 }}>production bench.</i>
              </h2>

              {/* Subtext + Get a quote — collapsed during intro, expands after */}
              <div ref={svcSubtextWrapRef} style={{
                maxHeight: 0, overflow: 'hidden', opacity: 0,
                transition: 'max-height .5s ease, opacity .5s ease',
                display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 24,
              }}>
                <p ref={svcSubtextRef} style={{
                  margin: '16px 0 0', maxWidth: 420, fontSize: 18, lineHeight: 1.6,
                  mixBlendMode: 'difference', color: '#FFF',
                }}>
                  Take the whole stack or the two pieces you are missing. Scope is set in a
                  simple statement of work, and work begins the day it is signed.
                </p>
                <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{
                  display: 'inline-flex', alignItems: 'center', gap: 12, padding: '18px 26px',
                  background: '#FFF', color: '#000', textDecoration: 'none', flexShrink: 0,
                  fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em',
                  textTransform: 'uppercase', fontWeight: 600, cursor: 'pointer',
                  pointerEvents: 'auto',
                }}>
                  <ThreeBar size={12} color="#000" />Get a quote
                </a>
              </div>

              {/* Cards — collapsed during intro, expands after */}
              <div ref={svcCardsWrapRef} style={{
                maxHeight: 0, overflow: 'hidden', opacity: 0,
                transition: 'max-height .6s ease, opacity .5s ease',
              }}>
                <div ref={svcCardsRef} style={{
                  marginTop: 44, display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10,
                  width: '100%',
                }}>
              {items.map((item, i) => {
                const t = item.name;
                const sub = item.desc;
                const inverted = (i + Math.floor(i / 4)) % 2 === 0;
                return (
                  <div key={t}
                    ref={el => cardsRef.current[i] = el}
                    style={{
                      background: inverted ? '#000' : '#FFF',
                      color: inverted ? '#FFF' : '#000',
                      border: `2px solid ${inverted ? '#FFF' : '#000'}`, padding: 28, minHeight: 'clamp(420px, 55vh, 720px)',
                      display: 'flex', flexDirection: 'column',
                    }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
                      <span style={{ fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.22em', opacity: .6 }}>/{String(i + 1).padStart(2, '0')}</span>
                      <ThreeBar size={20} color={inverted ? '#FFF' : '#000'} />
                    </div>

/* ═══ 05 · CASE — the chart is the logo, wider ═══ */
const CaseChart = () => {
  const sectionRef = useRef(null);
  const barsRef = useRef([]);
  const textRef = useRef(null);
  const peakRef = useRef(null);
  const heartbeatRef = useRef(null);
  const chartRef = useRef(null);
  const data = [66,147,140,156,193,210,227,198,213,193,133,138,
                197,215,315,337,367,444,427,395,320,254,203,149,
                202,224,274];
  const max = 460, peak = data.indexOf(444);

  useLayoutEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const bars = barsRef.current.filter(Boolean);
    if (!bars.length) return;

    // Set initial hidden state
    gsap.set(bars, { scaleY: 0 });
    gsap.set(textRef.current, { y: 30, opacity: 0 });
    if (peakRef.current) gsap.set(peakRef.current, { opacity: 0, y: 8 });

    let ctx = gsap.context(() => {
      /* In-view reveal — bars grow left→right, replays on enter */
      const revealBars = () => {
        gsap.to(bars, {
          scaleY: 1, stagger: 0.03, duration: 0.9, ease: 'power3.out',
        });
        gsap.to(textRef.current, {
          y: 0, opacity: 1, duration: 0.7, ease: 'power3.out', delay: 0.15,
        });
        if (peakRef.current) {
          gsap.to(peakRef.current, {
            opacity: 1, y: 0, duration: 0.45, ease: 'power2.out', delay: 0.6,
          });
        }
      };
      const hideBars = () => {
        gsap.killTweensOf(bars);
        gsap.to(bars, {
          scaleY: 0, stagger: { each: 0.03, from: 'end' }, duration: 0.6, ease: 'power2.in',
        });
        gsap.to(textRef.current, { y: 30, opacity: 0, duration: 0.4, ease: 'power2.in' });
        if (peakRef.current) gsap.to(peakRef.current, { opacity: 0, y: 8, duration: 0.3, ease: 'power2.in' });
      };

      /* Heartbeat starts after reveal, killed on hide */
      const startHeartbeat = () => {
        if (heartbeatRef.current) return;
        heartbeatRef.current = gsap.to(bars, {
          scaleY: (i) => 1 + Math.sin(i * 0.7) * 0.07,
          duration: 1.4,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1,
          overwrite: 'auto',
        });
      };
      const killHeartbeat = () => {
        if (heartbeatRef.current) { heartbeatRef.current.kill(); heartbeatRef.current = null; }
        gsap.set(bars, { scaleY: 1 });
      };

      ScrollTrigger.create({
        trigger: el,
        start: 'top 80%',
        onEnter: () => { revealBars(); setTimeout(startHeartbeat, 1400); },
        onLeaveBack: () => { hideBars(); killHeartbeat(); },
        onLeave: () => { hideBars(); killHeartbeat(); },
        onEnterBack: () => { revealBars(); setTimeout(startHeartbeat, 1400); },
      });
    }, el);
    return () => ctx.revert();
  }, []);

  return (
    <section ref={sectionRef} style={{ background: '#FFF', color: '#000', padding: '180px 6vw', borderTop: '1px solid #000', minHeight: '100vh', display: 'flex', alignItems: 'center' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: '5vw', alignItems: 'center', width: '100%' }}>
        <div ref={textRef}>
          <Kick>Client results · Guild Golf Carts</Kick>
          <h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(38px, 5vw, 76px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.06 }}>
            66 to 444 leads<br /><i style={{ fontWeight: 300 }}>a month.</i>
          </h2>
          <p style={{ margin: '28px 0 0', maxWidth: 400, fontSize: 16, lineHeight: 1.6, opacity: .75 }}>
            A five-location dealer group across Nevada, Oregon, Washington and Utah.
            We rebuilt the site on WordPress, ran geo-targeted paid search per city,
            published continuously and wired GA4, Tag Manager and CallRail into one
            Looker Studio dashboard.
          </p>
          <a href="work-variations/work-v6.html" style={{
            display: 'inline-block', marginTop: 28, paddingBottom: 4,
            borderBottom: '1px solid #000', textDecoration: 'none',
            fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase',
          }}>Read the case study →</a>
        </div>
        <div ref={chartRef} style={{ height: '60vh', display: 'flex', alignItems: 'flex-end', gap: 4, position: 'relative' }}>
          {data.map((v, i) => (
            <div key={i} style={{ flex: 1, height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', position: 'relative' }}>
              <div ref={el => barsRef.current[i] = el} style={{
                width: '100%', height: `${(v / max) * 100}%`, background: '#000',
                transformOrigin: 'bottom center',
                outline: i === peak ? '2px solid #000' : 'none', outlineOffset: i === peak ? 4 : 0,
              }} />
              {i === peak && (
                <div ref={peakRef} style={{
                  position: 'absolute', bottom: `${(v / max) * 100 + 4}%`, left: '50%',
                  transform: 'translateX(-50%)', whiteSpace: 'nowrap',
                  fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase',
                }}>▲ peak · jun 2025 · 444</div>
              )}
            </div>
          ))}
          <div style={{
            position: 'absolute', bottom: -26, left: 0, right: 0, display: 'flex',
            justifyContent: 'space-between', fontFamily: 'Geist Mono', fontSize: 10,
            letterSpacing: '.22em', textTransform: 'uppercase', opacity: .55,
          }}><span>jan 2024</span><span>jun 2025</span><span>mar 2026</span></div>
        </div>
      </div>
    </section>
  );
};

const QuoteModal = () => {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);

  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
