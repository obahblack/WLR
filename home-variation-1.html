<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Hooks ────────────────────────────────────────── */

const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => {
        if (e.isIntersecting) {
          setSeen(true);
          io.disconnect();
        }
      },
      { threshold: amount, rootMargin: '0px 0px -10% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const useParallax = (factor = -50) => {
  const ref = useRef(null);
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = ref.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const center = r.top + r.height / 2;
      const normalised = (center - vh / 2) / vh;
      setOffset(normalised * factor);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, [factor]);
  return [ref, offset];
};

const useCountUp = (end, duration = 2000, decimals = 0) => {
  const [val, setVal] = useState(0);
  const [active, setActive] = useState(false);
  const startTime = useRef(null);
  const raf = useRef(null);
  useEffect(() => {
    if (!active) return;
    startTime.current = performance.now();
    const step = (now) => {
      const elapsed = now - startTime.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(eased * end);
      if (progress < 1) {
        raf.current = requestAnimationFrame(step);
      }
    };
    raf.current = requestAnimationFrame(step);
    return () => {
      if (raf.current) cancelAnimationFrame(raf.current);
    };
  }, [active, end, duration]);
  return [val, () => setActive(true)];
};

/* ═══════════════════════════════════════════════════
   NAV — fixed top bar.
   Links ≥16px, brand ≥20px. Switches to black content
   when sitting over a light section.
   ═══════════════════════════════════════════════════ */
const Nav = () => {
  const [dark, setDark] = React.useState(false);

  React.useEffect(() => {
    const handle = () => {
      const probe = document.elementFromPoint(window.innerWidth / 2, 60);
      let node = probe;
      let bg = '';
      while (node && node !== document.body) {
        const c = window.getComputedStyle(node).backgroundColor;
        if (c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent') {
          bg = c;
          break;
        }
        node = node.parentElement;
      }
      const m = bg.match(/\d+/g);
      const light = m && m.length >= 3
        ? (0.299 * Number(m[0]) + 0.587 * Number(m[1]) + 0.114 * Number(m[2])) > 140
        : false;
      setDark(light);
    };
    handle();
    window.addEventListener('scroll', handle, { passive: true });
    window.addEventListener('resize', handle);
    return () => {
      window.removeEventListener('scroll', handle);
      window.removeEventListener('resize', handle);
    };
  }, []);

  const label = dark ? '#000' : '#FFF';

  return (
    <nav style={{
      position: 'fixed',
      top: 0,
      left: 0,
      right: 0,
      zIndex: 100,
      padding: '22px 48px',
      display: 'flex',
      justifyContent: 'space-between',
      alignItems: 'center',

      letterSpacing: '.04em',

      pointerEvents: 'none',

        : 'linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%)',
      transition: 'color .3s ease, background .3s ease',
    }}>
      <a
        href="home.html"
        style={{
          pointerEvents: 'auto',
          display: 'flex',
          alignItems: 'center',
          gap: 10,
          color: label,
          fontSize: 20,
          fontWeight: 600,
          letterSpacing: '.06em',
          transition: 'color .3s ease',

      >
        <BrandMark size={16} color={label} />
        White Label Resell

      <div style={{ pointerEvents: 'auto', display: 'flex', gap: 28, alignItems: 'center' }}>
        {[['Work', 'case-studies.html'], ['About', 'about.html'], ['Team', 'team.html'], ['Get a Quote', 'contact.html']].map(([t, h]) => (

              <polyline points="8 5 19 5 19 16" />
            </svg>
          </a>
        ))}
      </div>
    </nav>
  );
};

/* ═══════════════════════════════════════════════════
   02 · SCROLL REVEAL — GSAP ScrollTrigger
   Pinned section with split heading and vertical card flow.
   ═══════════════════════════════════════════════════ */
const ScrollReveal = () => {
  const sectionRef = React.useRef(null);
  const pinRef = React.useRef(null);
  const leftTextRef = React.useRef(null);
  const rightTextRef = React.useRef(null);
  const cardTrackRef = React.useRef(null);
  const eybrowRef = React.useRef(null);

  const cards = [
    { title: 'Discover & Define', desc: 'We dive deep into your goals, audience, and brand to uncover insights and define a clear direction.', stars: 1 },
    { title: 'Design & Build', desc: 'With strategy in place, we craft stunning visuals and high-performing digital solutions tailored to your needs.', stars: 2 },
    { title: 'Launch & Grow', desc: 'We bring your vision to life, optimize for performance, and support your ongoing success post-launch.', stars: 3 },
  ];

  const StarRow = React.memo(({ n }) => (
    <span style={{ display: 'inline-flex', gap: 6 }}>
      {[0,1,2].map(i => (
        <svg key={i} width="18" height="18" viewBox="0 0 24 24" fill={i < n ? '#000' : 'none'} stroke="#000" strokeWidth="1.5">
          <path d="M12 2L14.5 9.5L22 10L16.5 15L18 22L12 18.5L6 22L7.5 15L2 10L9.5 9.5L12 2Z" />
        </svg>
      ))}
    </span>
  ));

  const hs = {
    fontFamily: "'Inter', sans-serif",
    fontSize: 'clamp(36px, 5vw, 64px)',
    fontWeight: 600,
    lineHeight: 1.15,
    letterSpacing: '-.03em',
    color: '#000',
  };

  React.useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    gsap.registerPlugin(ScrollTrigger);

    const section = sectionRef.current;
    const pin = pinRef.current;
    const leftText = leftTextRef.current;
    const rightText = rightTextRef.current;
    const cardTrack = cardTrackRef.current;
    const eyebrow = eybrowRef.current;
    if (!section || !pin || !leftText || !rightText || !cardTrack || !eyebrow) return;

    const dropDist = () => {
      const pinH = pin.offsetHeight;
      return pinH * 0.42 - pinH * 0.14 - 16;
    };

    const calcEndY = () => {
      const card3 = cardTrack.children[2];
      if (!card3) return 0;
      const card3H = card3.offsetHeight;
      const gap = 32;
      const card1H = cardTrack.children[0]?.offsetHeight || 0;
      const card2H = cardTrack.children[1]?.offsetHeight || 0;
      const card3CenterOffset = card1H + gap + card2H + gap + card3H / 2;
      const trackTop = cardTrack.offsetTop || pin.offsetHeight * 0.42;
      return (window.innerHeight / 2) - (trackTop + card3CenterOffset);
    };

    const mm = gsap.matchMedia();

    mm.add('(min-width: 769px)', () => {
      gsap.set([leftText, rightText], { y: () => -dropDist() });
      gsap.set(cardTrack, { y: '100vh' });

      const dropTl = gsap.timeline({
        scrollTrigger: {
          trigger: section,
          start: 'top 50%',
          end: 'top top',
          scrub: 0.5,
          invalidateOnRefresh: true,
        },
      });
      dropTl.to(leftText, { y: 0, duration: 1, ease: 'none' }, 0);
      dropTl.to(rightText, { y: 0, duration: 1, ease: 'none' }, 0);
      dropTl.to(cardTrack, { y: '55vh', duration: 1, ease: 'none' }, 0);

      const splitTl = gsap.timeline({
        scrollTrigger: {
          trigger: section,
          start: 'top top',
          end: 'bottom bottom',
          pin: pin,
          scrub: 0.5,
          invalidateOnRefresh: true,
        },
      });
      splitTl.to(leftText, { x: -220, duration: 0.15, ease: 'none' }, 0);
      splitTl.to(rightText, { x: 220, duration: 0.15, ease: 'none' }, 0);
      splitTl.to(cardTrack, { y: '46vh', duration: 0.15, ease: 'none' }, 0);
      splitTl.to(cardTrack, { y: calcEndY, duration: 0.5, ease: 'none' }, 0.15);

      return () => { dropTl.kill(); splitTl.kill(); };
    });

    mm.add('(max-width: 768px)', () => {
      gsap.set([leftText, rightText], { y: () => -dropDist() });
      gsap.set(cardTrack, { y: '100vh' });

      const dropTl = gsap.timeline({
        scrollTrigger: {
          trigger: section,
          start: 'top 50%',
          end: 'top top',
          scrub: 0.5,
          invalidateOnRefresh: true,
        },
      });
      dropTl.to(leftText, { y: 0, duration: 1, ease: 'none' }, 0);
      dropTl.to(rightText, { y: 0, duration: 1, ease: 'none' }, 0);
      dropTl.to(cardTrack, { y: '55vh', duration: 1, ease: 'none' }, 0);

      const splitTl = gsap.timeline({
        scrollTrigger: {
          trigger: section,
          start: 'top top',
          end: 'bottom bottom',
          pin: pin,
          scrub: 0.5,
          invalidateOnRefresh: true,
        },
      });
      splitTl.to(leftText, { x: -100, duration: 0.15, ease: 'none' }, 0);
      splitTl.to(rightText, { x: 100, duration: 0.15, ease: 'none' }, 0);
      splitTl.to(cardTrack, { y: '46vh', duration: 0.15, ease: 'none' }, 0);
      splitTl.to(cardTrack, { y: calcEndY, duration: 0.5, ease: 'none' }, 0.15);

      return () => { dropTl.kill(); splitTl.kill(); };
    });

    return () => {
      mm.revert();
      ScrollTrigger.getAll().forEach(t => t.kill());
    };
  }, []);

  /* Reduced motion: plain layout */
  const isReducedMotion = typeof window !== 'undefined' &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  return (
    <section
      ref={sectionRef}
      style={{ background: '#F5F5F5', color: '#000', position: 'relative', minHeight: '300vh' }}
    >
      {/* Pinned viewport */}
      <div
        ref={pinRef}
        style={{
          width: '100%',
          height: '100vh',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          overflow: 'hidden',
        }}
      >
        {/* Eyebrow */}
        <div
          ref={eybrowRef}
          style={{
            position: 'absolute',
            top: '14%',
            left: '50%',
            transform: 'translateX(-50%)',
            fontFamily: 'Space Grotesk',
            fontSize: 12,
            letterSpacing: '.2em',
            textTransform: 'uppercase',
            whiteSpace: 'nowrap',
            zIndex: 1,
          }}
        >
          <BrandMark size={12} color="#000" /> From concept to launch
        </div>

        {/* Left heading */}
        <div
          ref={leftTextRef}
          style={{
            position: 'absolute',
            right: '50%',
            top: '42%',
            textAlign: 'left',
            paddingRight: 10,
            whiteSpace: 'nowrap',
            zIndex: 2,
          }}
        >
          <div style={hs}>Pathway</div>
          <div style={{ ...hs, marginTop: 2, textAlign: 'right' }}>
            and Lead
          </div>
        </div>

        {/* Right heading */}
        <div
          ref={rightTextRef}
          style={{
            position: 'absolute',
            left: '50%',
            top: '42%',
            textAlign: 'left',
            paddingLeft: 10,
            whiteSpace: 'nowrap',
            zIndex: 2,
          }}
        >
          <div style={hs}>to <em style={{ fontFamily: 'Geist', fontWeight: 400, fontStyle: 'italic' }}>growth,</em></div>
          <div style={{ ...hs, marginTop: 2 }}>generation</div>
        </div>

        {/* Card track — vertical column, moves upward */}
        <div
          ref={cardTrackRef}
          style={{
            position: 'absolute',
            left: '50%',
            top: '42%',
            transform: 'translateX(-50%)',
            display: 'flex',
            flexDirection: 'column',
            gap: 32,
            width: 'min(420px, 78vw)',
            zIndex: 3,
          }}
        >
          {cards.map((card, i) => (
            <div key={i} style={{ flexShrink: 0 }}>
              <div style={{ border: '2px solid rgba(0,0,0,0.06)', borderRadius: 18, padding: 8 }}>
                <div style={{ background: '#FFF', borderRadius: 12, padding: '28px 32px 32px', border: '1px solid rgba(0,0,0,0.04)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
                    <h3 style={{ fontFamily: "'Inter', sans-serif", fontSize: 20, fontWeight: 600, margin: 0, letterSpacing: '-.02em', color: '#000' }}>
                      {card.title}
                    </h3>
                    <StarRow n={card.stars} />
                  </div>

const LampEffect = () => {
  const rootRef = React.useRef(null);
  const lampRef = React.useRef(null);
  const lineRef = React.useRef(null);
  const leftConeRef = React.useRef(null);
  const rightConeRef = React.useRef(null);

  React.useEffect(() => {
    if (!window.gsap) return;
    gsap.registerPlugin(ScrollTrigger);

    const root = rootRef.current;
    const lamp = lampRef.current;
    const line = lineRef.current;
    const lc = leftConeRef.current;
    const rc = rightConeRef.current;
    if (!root || !lamp || !line || !lc || !rc) return;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      gsap.set(lamp, { width: '24rem' });
      gsap.set(line, { width: '38rem' });
      gsap.set([lc, rc], { width: '38rem', opacity: 1 });
      return;
    }

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: root,
        start: 'top bottom',
        end: 'top 25%',
        scrub: true,
        invalidateOnRefresh: true,
      },
    });

    tl.to(lamp, { width: '24rem', ease: 'none' }, 0)
      .to(line, { width: '38rem', ease: 'none' }, 0)
      .to(lc, { width: '38rem', opacity: 1, ease: 'none' }, 0)
      .to(rc, { width: '38rem', opacity: 1, ease: 'none' }, 0);

    return () => tl.kill();
  }, []);

  return (
    <div ref={rootRef} style={{
      position: 'absolute',
      top: 0,
      left: 0,
      right: 0,
      display: 'flex',
      alignItems: 'flex-start',
      justifyContent: 'center',
      pointerEvents: 'none',
      zIndex: 0,
      isolation: 'isolate',
    }}>
      {/* Backdrop blur strip */}
      <div style={{
        position: 'absolute',
        top: 0,
        left: 0,
        right: 0,
        height: '12rem',
        background: 'transparent',
        opacity: 0.1,
        WebkitBackdropFilter: 'blur(12px)',
        backdropFilter: 'blur(12px)',
        zIndex: 50,
      }} />

      {/* Main glow — static */}
      <div style={{
        position: 'absolute',
        top: 0,
        left: '50%',
        transform: 'translateX(-50%) translateY(30%)',
        height: '9rem',
        width: '38rem',
        borderRadius: '9999px',
        background: 'rgba(255,255,255,0.6)',
        opacity: 0.8,
        filter: 'blur(64px)',
        zIndex: 50,
      }} />

      {/* Lamp effect */}
      <div ref={lampRef} style={{
        position: 'absolute',
        top: 0,
        left: '50%',
        transform: 'translateX(-50%) translateY(-20%)',
        height: '9rem',
        width: '8rem',
        borderRadius: '9999px',
        background: 'rgba(255,255,255,0.6)',
        filter: 'blur(40px)',
        zIndex: 30,
      }} />

      {/* Top line */}
      <div ref={lineRef} style={{
        position: 'absolute',
        top: 0,
        left: '50%',
        transform: 'translateX(-50%) translateY(10%)',
        height: 2,
        width: '15rem',
        background: 'rgba(255,255,255,0.6)',
        zIndex: 50,
      }} />

      {/* Left gradient cone */}
      <div ref={leftConeRef} style={{
        position: 'absolute',
        right: '50%',
        top: 0,
        height: '14rem',
        width: '15rem',
        opacity: 0.5,
        zIndex: 30,
        backgroundImage: 'conic-gradient(from 70deg at center top, rgba(255,255,255,0.6) 0%, transparent 50%, transparent 100%)',
      }}>
        <div style={{
          position: 'absolute',
          left: 0,
          bottom: 0,
          width: '100%',
          height: '10rem',
          background: '#000',
          zIndex: 20,
          WebkitMaskImage: 'linear-gradient(to top, white, transparent)',
          maskImage: 'linear-gradient(to top, white, transparent)',
        }} />
        <div style={{
          position: 'absolute',
          left: 0,
          bottom: 0,
          width: '10rem',
          height: '100%',
          background: '#000',
          zIndex: 20,
          WebkitMaskImage: 'linear-gradient(to right, white, transparent)',
          maskImage: 'linear-gradient(to right, white, transparent)',
        }} />
      </div>

      {/* Right gradient cone */}
      <div ref={rightConeRef} style={{
        position: 'absolute',
        left: '50%',
        top: 0,
        height: '14rem',
        width: '15rem',
        opacity: 0.5,
        zIndex: 30,
        backgroundImage: 'conic-gradient(from 290deg at center top, transparent 0%, transparent 50%, rgba(255,255,255,0.6) 100%)',
      }}>
        <div style={{
          position: 'absolute',
          right: 0,
          bottom: 0,

        <div style={{

          width: '100%',

          zIndex: 20,
          WebkitMaskImage: 'linear-gradient(to top, white, transparent)',
          maskImage: 'linear-gradient(to top, white, transparent)',
        }} />
      </div>
    </div>
  );
};

const VideoBanner = () => {
  const [playing, setPlaying] = React.useState(false);
  const sectionRef = React.useRef(null);
  const cursorRef = React.useRef(null);
  const [hovering, setHovering] = React.useState(false);

  React.useEffect(() => {
    if (playing) return;
    const section = sectionRef.current;
    const cursor = cursorRef.current;
    if (!section || !cursor) return;

    const move = (e) => {
      const rect = section.getBoundingClientRect();
      cursor.style.left = `${e.clientX - rect.left}px`;
      cursor.style.top = `${e.clientY - rect.top}px`;
    };

    const enter = () => setHovering(true);
    const leave = () => setHovering(false);
    const click = () => setPlaying(true);

    section.addEventListener('mousemove', move);
    section.addEventListener('mouseenter', enter);
    section.addEventListener('mouseleave', leave);
    section.addEventListener('click', click);

    return () => {
      section.removeEventListener('mousemove', move);
      section.removeEventListener('mouseenter', enter);
      section.removeEventListener('mouseleave', leave);
      section.removeEventListener('click', click);
    };
  }, [playing]);

  const bracketStyle = (pos) => ({
    position: 'absolute',
    width: 14,
    height: 14,
    borderColor: '#000',
    borderStyle: 'solid',

    ...(pos === 'br' && { bottom: -8, right: -8, borderBottomWidth: 1.5, borderRightWidth: 1.5 }),

        backgroundSize: '200px',
        opacity: 0.6,
        pointerEvents: 'none',

      }} />

      {/* Brand mark — hidden when playing */}
      {!playing && (
        <div style={{ position: 'absolute', zIndex: 1 }}>

      )}

      {/* Video embed */}
      {playing && (
        <div style={{

        }}>
          <iframe
