<script type="text/babel">
/* ════════════════════════════════════════════════════════════════════
   Shared components for the About variations (about-v1/v2/v3).
   Single source of truth — inlined into each page by build.js so pages
   render when opened directly via file:// (Babel cannot fetch external
   text/babel scripts from file://). Data lives in shared-data.js
   (plain JS, loaded via <script src>).
   Design language mirrors home.html: pure #000/#FFF, Geist + Geist Mono,
   mono kickers, hairline rules, fade-and-rise reveal motion.
   ════════════════════════════════════════════════════════════════════ */

const { useState, useEffect, useRef } = React;

const A = window.ABOUT;

/* ── mark ─────────────────────────────────────────── */
const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2, animate = false }) => {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!animate) return;
    let r;
    const tick = () => { setT(x => x + 0.016); r = requestAnimationFrame(tick); };
    r = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(r);
  }, [animate]);
  const base = [0.66, 1, 0.82];
  const heights = animate ? base.map((h, i) => 0.4 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.6 + i * 0.7))) : base;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap, height: size }}>
      {heights.map((h, i) => (
        <span key={i} style={{ width: size * 0.22, height: `${h * 100}%`, background: color }} />
      ))}
    </span>
  );
};

/* ── motion ───────────────────────────────────────── */
const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } },
      { threshold: amount, rootMargin: '0px 0px -12% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { setCurtainOpen(e.isIntersecting); },
      { threshold: 0.35 }

    return () => io.disconnect();

    const enter = () => setHovering(true);
    const leave = () => setHovering(false);
    s.addEventListener('mousemove', move);
    s.addEventListener('mouseenter', enter);
    s.addEventListener('mouseleave', leave);

                    allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowFullScreen />

        {playing ? (

        <h2 style={{ margin: 0, fontFamily: 'Geist, sans-serif', fontSize: 'clamp(40px,5.4vw,84px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.02 }}>
          The people behind<br /><i style={{ fontWeight: 300 }}>the work.</i>
        </h2>
      </div>
      <div className="team-grid">
        {A.team.map((m, i) => {
          const delay = (i % 4) * 70 + Math.floor(i / 4) * 120;
          return (
            <div key={m.name} style={{
              opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(18px)',
              transition: `opacity .6s ease ${seen ? delay : 0}ms, transform .6s cubic-bezier(.2,.8,.2,1) ${seen ? delay : 0}ms`,
            }}>
              <CheckerTeamCard m={m} i={i} seen={seen} hover={hover === i}
                               onEnter={() => setHover(i)} onLeave={() => setHover(-1)} />
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 48, textAlign: 'center' }}>
        <Btn href={A.teamHref} light outline>Meet the full team</Btn>
      </div>
    </section>
  );
};

const Departments = () => {
  const sectionRef = useRef(null);
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const rect = el.getBoundingClientRect();
        const vh = window.innerHeight;
        const sectionCenter = rect.top + rect.height / 2;
        const p = Math.max(0, Math.min(1, (vh - sectionCenter) / (vh * 0.6)));
        setProgress(p);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <section ref={sectionRef} style={{ position: 'relative', background: '#FFF', color: '#000', padding: '120px 6vw', borderTop: '1px solid #000', overflow: 'hidden' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 24, marginBottom: 48 }}>
        <div>
          <Kick style={{ opacity: .55 }}>The disciplines</Kick>
          <h2 style={{ margin: 0, fontFamily: 'Geist, sans-serif', fontSize: 'clamp(40px,5.4vw,84px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.02 }}>
            Eight disciplines,<br /><i style={{ fontWeight: 300 }}>one standard.</i>
          </h2>
        </div>
        <p style={{ margin: 0, maxWidth: 400, fontSize: 15, lineHeight: 1.6, opacity: .7, fontWeight: 300 }}>
          Each area is led by a specialist who works with the rest of the bench on every client — not in isolation.
        </p>
      </div>
      <div className="dept-grid">
        {A.departments.map((d, i) => {
          const stagger = i * 0.06;
          const tileProgress = Math.max(0, Math.min(1, (progress - stagger) / 0.5));
          return <DeptCard key={d.name} d={d} i={i} progress={tileProgress} wide={i === 0 || i === 7} light />;
        })}
      </div>
    </section>
  );
};

const QuadJourney = () => {
  const trackRef = React.useRef(null);
  const markRef = React.useRef(null);
  const cardRef = React.useRef(null);
  const [lineTop, setLineTop] = React.useState(0);
  const [lineH, setLineH] = React.useState(0);
  const [cardBg, setCardBg] = React.useState('#FFF');
  const [cardColor, setCardColor] = React.useState('#000');
  const [cardBorder, setCardBorder] = React.useState('#000');
  const [cardDark, setCardDark] = React.useState(false);

  React.useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const track = trackRef.current;
        const mark = markRef.current;
        const card = cardRef.current;
        if (!track || !mark || !card) return;
        const trackRect = track.getBoundingClientRect();
        const markRect = mark.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();
        const logoBottom = markRect.bottom - trackRect.top;
        const cardTop = cardRect.top - trackRect.top;
        const gap = cardTop - logoBottom;
        if (gap <= 0) {
          setLineTop(logoBottom);
          setLineH(0);
          setCardBg('#000');
          setCardColor('#FFF');
          setCardBorder('#000');
          setCardDark(true);
          return;
        }
        const viewH = window.innerHeight;
        const startTrigger = viewH * 0.55;
        const scrolled = startTrigger - markRect.bottom;
        const progress = Math.max(0, Math.min(1, scrolled / gap));
        const PHASE_A = 0.55;
        let lt, lh, bgR;
        if (progress <= PHASE_A) {
          const t = progress / PHASE_A;
          lt = logoBottom;
          lh = t * gap;
          bgR = 0;
        } else {
          const t = (progress - PHASE_A) / (1 - PHASE_A);
          lt = logoBottom + t * gap;
          lh = (1 - t) * gap;
          bgR = t;
        }
        setLineTop(lt);
        setLineH(lh);
        const r = Math.round(255 * (1 - bgR));
        setCardBg(`rgb(${r},${r},${r})`);
        setCardColor(bgR > 0.5 ? '#FFF' : '#000');
          setCardBorder(bgR > 0.5 ? '#000' : '#FFF');
        setCardDark(bgR > 0.5);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div ref={trackRef} style={{ position: 'relative' }}>
      <div style={{
        position: 'absolute', left: '50%', transform: 'translateX(-50%)',
        top: lineTop, width: 24, height: lineH,
        background: '#000', borderRadius: 0, pointerEvents: 'none', zIndex: 1,
      }} />
      <Quad markRef={markRef} />
      <Journey cardRef={cardRef} cardBg={cardBg} cardColor={cardColor} cardBorder={cardBorder} cardDark={cardDark} />
    </div>
  );
};

const QuoteModal = () => {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);

  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div onClick={() => setOpen(false)} style={{
        position: 'absolute', inset: 0, background: 'rgba(0,0,0,.5)',
      }} />
      <div style={{
        position: 'relative', width: '90vw', maxWidth: 640, maxHeight: '90vh',
        overflow: 'auto',
      }}>
        <button onClick={() => setOpen(false)} style={{
          position: 'fixed', top: 20, right: 24, zIndex: 2,
          background: 'none', border: '1px solid #000', color: '#000', cursor: 'pointer',
          fontFamily: 'Geist Mono', fontSize: 16, lineHeight: 1, padding: '6px 10px',
        }}>&#x2715;</button>
        <iframe src="../quote-v1.html" title="Get a Quote" style={{
          width: '100%', height: '85vh', border: 'none',
        }} />
      </div>
    </div>
  );
};

const App = () => (
  <React.Fragment>
    <QuoteModal />
    <HUD active="about" />
    <Hero />
    <QuadJourney />
    <Team />
    <VideoSection />
    <Departments />
    <Cta />
    <Footer />
  </React.Fragment>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
