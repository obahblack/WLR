<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<link rel="preconnect" href="https://fonts.googleapis.com">

  *, *::before, *::after { box-sizing: border-box; }

  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01ms !important; } }

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── shared chrome ─────────────────────────────── */
const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2 }) => (
  <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap, height: size }}>
    {[0.66, 1, 0.82].map((h, i) => (
      <span key={i} style={{ width: size * 0.22, height: `${h * 100}%`, background: color }} />
    ))}
  </span>
);

const Kick = ({ children, style = {} }) => (
  <div style={{ fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase', opacity: .6, marginBottom: 16, ...style }}>{children}</div>
);

const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: amount, rootMargin: '0px 0px -12% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

/* ── view router ───────────────────────────────── */
const navigateTo = (v) => { window.dispatchEvent(new CustomEvent('wlr-nav', { detail: v })); window.scrollTo({ top: 0, behavior: 'instant' }); };

/* ── HUD ───────────────────────────────────────── */
const HUD = ({ view }) => (
  <div style={{
    position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
    mixBlendMode: 'difference', pointerEvents: 'none',
    padding: '20px 32px', display: 'flex', justifyContent: 'space-between',
    alignItems: 'center', color: '#FFF',
    fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase',
  }}>
    <a href="#" onClick={(e) => { e.preventDefault(); navigateTo('home'); }} style={{ pointerEvents: 'auto', display: 'inline-flex', alignItems: 'center', gap: 12, color: '#FFF', textDecoration: 'none' }}>
      <ThreeBar size={14} color="#FFF" gap={3} />White Label Resell
    </a>
    <span style={{ pointerEvents: 'auto', display: 'flex', gap: 24 }}>
      {[['Work','work'],['About','about'],['Team','team']].map(([l, v]) => (
        <a key={v} href="#" onClick={(e) => { e.preventDefault(); navigateTo(v); }} style={{ color: '#FFF', textDecoration: 'none', borderBottom: view === v ? '1px solid #FFF' : '1px solid transparent', paddingBottom: 2 }}>{l}</a>
      ))}
      <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ color: '#FFF', textDecoration: 'none', cursor: 'pointer' }}>Get a Quote</a>
    </span>
  </div>
);

/* ── scroll rail: index ticks through the page ─── */
const ScrollRail = ({ sections }) => {
  const [p, setP] = useState(0);
  useEffect(() => {
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setP(h > 0 ? window.scrollY / h : 0);
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  const active = Math.min(sections.length - 1, Math.floor(p * sections.length));
  return (
    <div style={{ position: 'fixed', right: 24, top: '50%', transform: 'translateY(-50%)', zIndex: 90, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10, mixBlendMode: 'difference', color: '#FFF' }}>
      {sections.map((s, i) => (
        <div key={s} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontFamily: 'Geist Mono', fontSize: 9, letterSpacing: '.18em', opacity: i === active ? 1 : 0, transition: 'opacity .3s ease', whiteSpace: 'nowrap' }}>{s}</span>
          <span style={{ width: i === active ? 22 : 8, height: 2, background: '#FFF', transition: 'width .3s ease', opacity: i === active ? 1 : .4 }} />
        </div>
      ))}
    </div>
  );
};

/* ══════════════════ HOME ══════════════════ */

/* 01 · Hero — hover inverts frame, bars grow */
const Hero = () => {
  const [hover, setHover] = useState(false);
  const [lit, setLit] = useState(false);
  const [ref, seen] = useReveal(0.1);
  useEffect(() => { const t = setTimeout(() => setLit(true), 120); return () => clearTimeout(t); }, []);
  return (
    <section ref={ref} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{
      minHeight: '100vh', background: hover ? '#FFF' : '#000', color: hover ? '#000' : '#FFF',
      transition: 'background .55s cubic-bezier(.2,.8,.2,1), color .55s ease',
      display: 'grid', gridTemplateColumns: '1fr 1fr', alignItems: 'center',
      padding: '140px 6vw 90px', gap: '4vw',
    }}>
      <div style={{ position: 'relative', zIndex: 2 }}>
        <Kick style={{ opacity: .55 }}>01 / Index</Kick>
        <h1 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(48px, 6.8vw, 116px)', fontWeight: 500, letterSpacing: '-.045em', lineHeight: 1.02, opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(28px)', transition: 'opacity .9s ease .1s, transform .9s cubic-bezier(.2,.8,.2,1) .1s' }}>
          Your clients see you.<br /><i>We do the work.</i>
        </h1>
        <p style={{ margin: '30px 0 0', maxWidth: 470, fontSize: 'clamp(16px, 1.25vw, 19px)', lineHeight: 1.6, opacity: .8 }}>
          SEO, content, web development, paid media and analytics — built and shipped under your agency's brand. You keep the client, the credit and the margin.
        </p>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 40 }}>
          <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ display: 'inline-flex', alignItems: 'center', gap: 12, padding: '18px 26px', background: 'currentColor', textDecoration: 'none', fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em', textTransform: 'uppercase', fontWeight: 600, cursor: 'pointer' }}>
            <span style={{ color: hover ? '#FFF' : '#000', display: 'inline-flex', alignItems: 'center', gap: 12 }}><ThreeBar size={12} color={hover ? '#FFF' : '#000'} />Get a quote</span>
          </a>
          <a href="#" onClick={(e) => { e.preventDefault(); navigateTo('work'); }} style={{ display: 'inline-flex', alignItems: 'center', padding: '18px 26px', border: '1px solid currentColor', textDecoration: 'none', fontFamily: 'Geist Mono', fontSize: 12, letterSpacing: '.22em', textTransform: 'uppercase' }}>See the work →</a>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '1.2vw', height: '62vh', justifyContent: 'center' }}>
        {[0.7, 1, 0.85].map((h, i) => (
          <div key={i} style={{ width: 'clamp(60px, 8vw, 130px)', height: lit ? `${h * (hover ? 102 : 94)}%` : '0%', background: 'currentColor', transition: `height 1s cubic-bezier(.2,.8,.2,1) ${i * 110}ms` }} />
        ))}
      </div>
    </section>
  );
};

/* 02 · Sell/Deliver — sticky horizontal track with background flip */
const SellDeliver = () => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const sdStageRef = useRef(null);
  const barRefs = [useRef(null), useRef(null), useRef(null)];
  const sdHeadingRef = useRef(null);
  const pctRef = useRef(null);
  const wipeRef = useRef(null);
  const svcHeadingRef = useRef(null);
  const cardsRef = useRef([]);

  const items = [
    ['Technical SEO', 'Audits, site speed, schema'],
    ['Content production', 'Up to 1M words a year'],
    ['WordPress development', 'Custom themes, Elementor'],
    ['eCommerce builds', 'Shopify, WooCommerce, payments'],
    ['Paid search', 'Google, Shopping, YouTube'],
    ['Paid social', 'Meta, Instagram, retargeting'],
    ['Local SEO', '80+ citations a month, GMB'],
    ['Link acquisition', 'Digital PR and outreach'],
    ['Email marketing', 'Campaigns, flows, A/B testing'],
    ['GA4 & Tag Manager', 'Event design, QA, migration'],
    ['Looker Studio reporting', 'White-labeled dashboards'],
    ['Hosting & maintenance', 'LiteSpeed, backups, SSL'],
  ];

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0, lastFlip = null, lastPct = null;
    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));

      const sdP = Math.min(1, p / 0.45);
      for (let i = 0; i < 3; i++) {
        const start = .10 + i * .12, end = start + .34;
        const w = Math.max(0, Math.min(1, (sdP - start) / (end - start)));
        if (barRefs[i].current) barRefs[i].current.style.transform = `scaleX(${w})`;
      }
      const flip = sdP > .5;
      if (flip !== lastFlip) {
        lastFlip = flip;
        if (sdStageRef.current) { sdStageRef.current.style.backgroundColor = flip ? '#FFFFFF' : '#000000'; sdStageRef.current.style.color = flip ? '#000000' : '#FFFFFF'; }
        if (sdHeadingRef.current) {
          sdHeadingRef.current.style.transition = 'opacity .25s ease, transform .25s ease';
          sdHeadingRef.current.style.opacity = '0';
          sdHeadingRef.current.style.transform = 'scale(0.95) translateY(-12px)';
          setTimeout(() => {
            if (sdHeadingRef.current) {
              sdHeadingRef.current.textContent = flip ? 'We deliver.' : 'You sell.';
              sdHeadingRef.current.style.opacity = '1';
              sdHeadingRef.current.style.transform = 'scale(1) translateY(0)';
            }
          }, 260);
        }
      }
      const pct = String(Math.round(sdP * 100)).padStart(3, '0') + '%';
      if (pct !== lastPct && pctRef.current) { lastPct = pct; pctRef.current.textContent = pct; }

      const slideP = Math.max(0, Math.min(1, (p - 0.45) / 0.20));
      const eased = 1 - Math.pow(1 - slideP, 3);
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-eased * 100}vw)`;

      const wipeP = Math.max(0, Math.min(1, (p - 0.60) / 0.20));
      if (wipeRef.current) wipeRef.current.style.clipPath = `inset(0 ${(1 - wipeP) * 100}% 0 0)`;

      const shrinkP = Math.max(0, Math.min(1, (p - 0.72) / 0.12));
      if (svcHeadingRef.current) {
        const s = 1 - shrinkP * 0.55;
        svcHeadingRef.current.style.transform = `translateY(${shrinkP * -7}vh) scale(${s})`;
      }

      const cardP = Math.max(0, Math.min(1, (p - 0.76) / 0.16));
      cardsRef.current.filter(Boolean).forEach((card, i) => {
        const delay = i * 0.02;
        const local = Math.max(0, Math.min(1, (cardP - delay) / (0.65 - delay)));
        card.style.opacity = String(local);
        card.style.transform = `translateY(${(1 - local) * 24}px)`;
      });
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', measure); if (raf) cancelAnimationFrame(raf); };
  }, []);

  return (
    <section ref={sectionRef} style={{ height: '500vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>
        <div ref={trackRef} style={{ display: 'flex', width: '200vw', height: '100vh', willChange: 'transform' }}>
          <div ref={sdStageRef} style={{ width: '100vw', height: '100vh', position: 'relative', backgroundColor: '#000', color: '#FFF', transition: 'background-color .45s ease, color .45s ease', flexShrink: 0 }}>
            <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
              {[0, 1, 2].map(i => (
                <div key={i} ref={barRefs[i]} style={{ position: 'absolute', left: 0, right: 0, top: `${19 + i * 23}%`, height: '13%', backgroundColor: '#FFF', transformOrigin: 'left center', transform: 'scaleX(0)', willChange: 'transform', mixBlendMode: 'difference' }} />
              ))}
            </div>
            <div style={{ position: 'absolute', top: 90, left: 32, right: 32, display: 'flex', justifyContent: 'space-between', fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em', textTransform: 'uppercase', opacity: .6, mixBlendMode: 'difference', color: '#FFF' }}>
              <span>The partnership, in two words</span><span ref={pctRef}>000%</span>
            </div>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none' }}>
              <h2 ref={sdHeadingRef} style={{ margin: 0, textAlign: 'center', fontFamily: 'Geist', fontSize: 'clamp(72px, 15vw, 220px)', fontWeight: 500, letterSpacing: '-.045em', lineHeight: 1.08, color: '#FFF', mixBlendMode: 'difference' }}>You sell.</h2>
            </div>
            <p style={{ position: 'absolute', bottom: 90, left: 32, right: 32, margin: 0, maxWidth: 620, fontSize: 'clamp(15px, 1.15vw, 18px)', lineHeight: 1.6, opacity: .75 }}>
              You own the relationship, the pitch and the invoice. We run production behind the scenes — on your templates, in your voice, to your deadlines. Your clients never learn our name, and that is the entire point.
            </p>
          </div>

          <div style={{ width: '100vw', height: '100vh', position: 'relative', flexShrink: 0 }}>
            <div style={{ position: 'absolute', inset: 0, background: '#FFF', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 6vw' }}>
              <div style={{ fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', opacity: 0.55, marginBottom: 20 }}>02 / Services</div>
            </div>
            <h2 ref={svcHeadingRef} style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 6vw', margin: 0, fontFamily: 'Geist', fontSize: 'clamp(52px, 8.5vw, 148px)', fontWeight: 600, letterSpacing: '-.045em', lineHeight: 0.92, mixBlendMode: 'difference', color: '#FFF', zIndex: 3, pointerEvents: 'none', willChange: 'transform' }}>
              Twelve services,<br /><i>one contract.</i>
            </h2>
            <div ref={wipeRef} style={{ position: 'absolute', inset: 0, background: '#000', clipPath: 'inset(0 100% 0 0)', willChange: 'clip-path', zIndex: 1 }} />
          </div>
        </div>

        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: '#000', color: '#FFF', padding: '0 6vw 60px', opacity: 0, transform: 'translateY(60px)', willChange: 'transform, opacity', zIndex: 2 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 24 }}>
            <p style={{ margin: 0, maxWidth: 420, fontSize: 16, lineHeight: 1.6, opacity: 0.7 }}>Take the whole stack or the two pieces you are missing. Scope is set in a simple statement of work, and work begins the day it is signed.</p>
            <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ display: 'inline-block', padding: '14px 32px', background: '#FFF', color: '#000', fontFamily: 'Geist', fontSize: 14, fontWeight: 500, letterSpacing: '-.02em', textDecoration: 'none', whiteSpace: 'nowrap', flexShrink: 0, cursor: 'pointer' }}>Get a quote</a>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
            {items.map(([t, sub], i) => {
              const inverted = (i + Math.floor(i / 4)) % 2 === 0;
              return (
                <div key={t} ref={el => cardsRef.current[i] = el} style={{ background: inverted ? '#FFF' : 'transparent', color: inverted ? '#000' : '#FFF', border: '1px solid #FFF', padding: 22, minHeight: 190, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', opacity: 0, willChange: 'transform, opacity' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.22em', opacity: .6 }}>/{String(i + 1).padStart(2, '0')}</span>
                    <ThreeBar size={20} color="currentColor" />
                  </div>
                  <div>
                    <div style={{ fontFamily: 'Geist', fontSize: 'clamp(18px,1.6vw,24px)', fontWeight: 500, letterSpacing: '-.02em', lineHeight: 1.1 }}>{t}</div>
                    <div style={{ marginTop: 8, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', opacity: .6 }}>{sub}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </section>
  );
};

/* 03 · Positioning — scroll-linked word reveal on a flip */
const Positioning = () => {
  const sectionRef = useRef(null);
  const wordRefs = useRef([]);
  const [entered, setEntered] = useState(false);

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    const words = wordRefs.current.filter(Boolean);
    if (!words.length) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const vh = window.innerHeight;
      for (let i = 0; i < words.length; i++) {
        const r = words[i].getBoundingClientRect();
        const center = r.top + r.height / 2;
        const p = Math.max(0, Math.min(1, 1 - (center - vh * 0.3) / (vh * 0.5)));
        words[i].style.opacity = 0.15 + p * 0.85;
        words[i].style.filter = `blur(${(1 - p) * 3}px)`;
      }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setEntered(true); measure(); } }, { threshold: 0.1, rootMargin: '0px 0px -10% 0px' });
    io.observe(section);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); if (raf) cancelAnimationFrame(raf); io.disconnect(); };
  }, []);

  const l1 = 'Hiring a specialist for every discipline is';
  const l2 = 'Renting a full bench is';
  const highlight = (line, extraOffset) => line.split(' ').map((w, i) => (
    <span key={i} ref={el => wordRefs.current[extraOffset + i] = el} style={{ display: 'inline-block', opacity: 0.15, marginRight: '0.3em' }}>{w}</span>
  ));

  return (
    <section ref={sectionRef} style={{ background: '#000', color: '#FFF', padding: '140px 6vw 120px', borderTop: '1px solid #FFF' }}>
      <Kick>03 / Why agencies partner with us</Kick>
      <div style={{ fontFamily: 'Geist', fontSize: 'clamp(38px, 6.4vw, 104px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.05 }}>
        <div>{highlight(l1, 0)}<span style={{ background: '#FFF', color: '#000', padding: '0 20px', display: 'inline-block', fontStyle: 'italic', fontWeight: 300 }}>slow&nbsp;and&nbsp;expensive.</span></div>
        <div style={{ marginTop: 14 }}>{highlight(l2, l1.split(' ').length)}<span style={{ background: '#FFF', color: '#000', padding: '0 20px', display: 'inline-block', fontStyle: 'italic', fontWeight: 300 }}>neither.</span></div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 40, marginTop: 80, maxWidth: 1200 }}>
        {[
          ['Capacity without headcount', 'Add SEO, content, development or analytics to your offering this month — no recruiting, no salaries, no bench risk.'],
          ['Delivered under your brand', 'Reports, decks, builds and dashboards ship in your identity. We sign mutual NDAs as standard.'],
          ['Built on results, not retainers', 'Every engagement is measured in leads, rankings and revenue your client can see.'],
        ].map(([t, b], i) => (
          <div key={t} style={{ opacity: entered ? 1 : 0, transform: entered ? 'none' : 'translateY(18px)', transition: `all .6s ease ${300 + i * 110}ms` }}>
            <ThreeBar size={18} color="#FFF" gap={3} />
            <h3 style={{ margin: '18px 0 10px', fontSize: 'clamp(19px,1.6vw,24px)', fontWeight: 500, letterSpacing: '-.02em' }}>{t}</h3>
            <p style={{ margin: 0, fontSize: 15, lineHeight: 1.6, opacity: .72 }}>{b}</p>
          </div>
        ))}
      </div>
    </section>
  );
};

/* 04 · Case chart — bars draw on reveal */
const CaseChart = () => {
  const [ref, seen] = useReveal(.2);
  const data = [66,147,140,156,193,210,227,198,213,193,133,138,197,215,315,337,367,444,427,395,320,254,203,149,202,224,274];
  const max = 460, peak = data.indexOf(444);
  return (
    <section ref={ref} style={{ background: '#FFF', color: '#000', padding: '120px 6vw', borderTop: '1px solid #000' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: '5vw', alignItems: 'flex-end' }}>
        <div>
          <Kick>04 / Client results · Guild Golf Carts</Kick>
          <h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(38px, 5vw, 76px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.06 }}>
            66 to 444 leads<br /><i>a month.</i>

/* Horizontal clients — cards scroll within panel, then track slides to case heading */
const HorizontalProjects = () => {
  const sectionRef = useRef(null);
  const cardsTrackRef = useRef(null);
  const trackRef = useRef(null);
  const cardsHeadingRef = useRef(null);
  const [seen, setSeen] = useState(false);

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));
      if (!seen && r.top < vh * 0.7) setSeen(true);

      const cardsP = Math.max(0, Math.min(1, p / 0.45));
      const cardsEased = 1 - Math.pow(1 - cardsP, 3);
      const total = PROJECTS.length;
      const cardsWidth = total * CARD_W + (total - 1) * CARD_GAP;
      const vw = window.innerWidth;
      const maxCardTx = Math.max(0, cardsWidth - (vw * 0.88));
      if (cardsTrackRef.current) cardsTrackRef.current.style.transform = `translateX(${-cardsEased * maxCardTx}px)`;

      const cardFade = Math.max(0, Math.min(1, (p - 0.38) / 0.14));
      if (cardsHeadingRef.current) cardsHeadingRef.current.style.opacity = String(1 - cardFade);

      const trackP = Math.max(0, Math.min(1, (p - 0.38) / 0.34));
      const trackEased = 1 - Math.pow(1 - trackP, 3);
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-trackEased * 100}vw)`;
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', measure); if (raf) cancelAnimationFrame(raf); };
  }, [seen]);

  return (
    <section ref={sectionRef} style={{ height: '380vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>
        <div ref={trackRef} style={{ display: 'flex', width: '200vw', height: '100vh', willChange: 'transform' }}>
          <div style={{ width: '100vw', height: '100vh', position: 'relative', background: '#FFF', color: '#000', display: 'flex', flexDirection: 'column', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}>
            <div ref={cardsHeadingRef} style={{ padding: '0 6vw', marginBottom: 44, opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(32px)', transition: 'opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1)' }}>
              <Kick style={{ color: '#000' }}>Brands we work for</Kick>
              <h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(36px, 5vw, 72px)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1 }}>Our clients.</h2>
              <p style={{ margin: '16px 0 0', fontSize: 'clamp(14px, 1.1vw, 17px)', lineHeight: 1.6, opacity: .5, maxWidth: 480 }}>Some of the current and past clients we have delivered product, website, SEO, and marketing projects for.</p>
            </div>
            <div ref={cardsTrackRef} style={{ display: 'flex', gap: CARD_GAP, paddingLeft: '6vw', alignItems: 'stretch', willChange: 'transform' }}>
              {PROJECTS.map((proj, i) => <ProjectCard key={i} project={proj} index={i} seen={seen} />)}
            </div>
          </div>

          <div id="case-studies" style={{ width: '100vw', height: '100vh', background: '#000', color: '#FFF', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ textAlign: 'center' }}>
              <Kick>Featured work</Kick>
              <h2 style={{ margin: 0, fontFamily: 'Geist', fontSize: 'clamp(64px, 10vw, 180px)', fontWeight: 600, letterSpacing: '-.045em', lineHeight: 0.92 }}>Case <span style={{ background: '#FFF', color: '#000', padding: '0 20px', display: 'inline-block', fontStyle: 'italic', fontWeight: 300 }}>studies.</span></h2>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};
