<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── mark ─────────────────────────────────────────── */
const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2 }) => (
  <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap, height: size }}>
    {[0.66, 1, 0.82].map((h, i) => (

    ))}

/* ── scroll hooks ─────────────────────────────────────
   useReveal: fires once, only when the element is genuinely
   on screen (15% inset), so nothing animates off-viewport.
   useProgress: 0→1 as the element travels through the viewport,
   so any motion driven by it is locked to the scrollbar.       */
const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } },
      { threshold: amount, rootMargin: '0px 0px -12% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const useProgress = () => {
  const ref = useRef(null);
  const [p, setP] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0, trail = 0;
    const measure = () => {
      raf = 0;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      setP(span <= 0
        ? Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)))
        : Math.max(0, Math.min(1, -r.top / span)));
    };
    const onScroll = () => {
      // measure on a rAF tick, then always re-measure on the trailing edge
      // so the final coalesced scroll event is never dropped
      if (!raf) raf = requestAnimationFrame(measure);
      clearTimeout(trail);
      trail = setTimeout(measure, 90);
    };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(trail);
    };
  }, []);
  return [ref, p];
};

    <span style={{ pointerEvents: 'auto', display: 'flex', gap: 24 }}>

);

const Kick = ({ children, style = {} }) => (

);

/* ═══ 01 · HERO — hover inverts the whole frame ═══ */

          }} />
        ))}

        <h1 style={{

        </p>

          <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{
            display: 'inline-flex', alignItems: 'center', gap: 12, padding: '18px 26px',
            background: 'currentColor', textDecoration: 'none',

          }}>
            <span style={{ color: hover ? '#FFF' : '#000', display: 'inline-flex', alignItems: 'center', gap: 12 }}>
              <ThreeBar size={12} color={hover ? '#FFF' : '#000'} />Get a quote
            </span>
          </a>
          <a href="work-variations/work-v6.html" style={{
            display: 'inline-flex', alignItems: 'center', padding: '18px 26px',
            border: '1px solid currentColor', textDecoration: 'none',

/* ═══ 02+04 · SELL/DELIVER + SERVICES — unified horizontal track ═══
   SellDeliver (left) and Services heading (right, off-screen) sit on the
   same horizontal plane. Scroll drives: wipe → horizontal slide → black
   wipe → heading shrink → cards. No vertical scroll until cards.          */
const SellDeliver = () => {
  const sectionRef = useRef(null);
  const trackRef = useRef(null);
  const sdStageRef = useRef(null);
  const barRefs = [useRef(null), useRef(null), useRef(null)];
  const sdHeadingRef = useRef(null);
  const pctRef = useRef(null);
  const svcHeadingRef = useRef(null);
  const wipeRef = useRef(null);
  const cardsRef = useRef([]);
  const cardsSectionRef = useRef(null);
  const cardsWrapRef = useRef(null);

  const items = [
    ['Technical SEO', 'Audits, site speed, schema'],
    ['Content production', 'Up to 1M words a year'],
    ['WordPress development', 'Custom themes, Elementor'],
    ['eCommerce builds', 'Shopify, WooCommerce, payments'],
    ['Paid search', 'Google, Shopping, YouTube'],
    ['Paid social', 'Meta, Instagram, retargeting'],
    ['Local SEO', '80+ citations a month, GMB'],
    ['Link acquisition', 'Digital PR and outreach'],
    ['Email marketing', 'Campaigns, flows, A/B testing'],
    ['GA4 & Tag Manager', 'Event design, QA, migration'],
    ['Looker Studio reporting', 'White-labeled dashboards'],
    ['Hosting & maintenance', 'LiteSpeed, backups, SSL'],
  ];

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0, lastFlip = null, lastPct = null;

    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));

      /* ─── Phase 1 (0→0.45): SellDeliver wipe bars + flip ─── */
      const sdP = Math.min(1, p / 0.45);
      for (let i = 0; i < 3; i++) {
        const start = .10 + i * .12, end = start + .34;
        const w = Math.max(0, Math.min(1, (sdP - start) / (end - start)));
        const el = barRefs[i].current;
        if (el) el.style.transform = `scaleX(${w})`;
      }
      const flip = sdP > .5;
      if (flip !== lastFlip) {
        lastFlip = flip;
        if (sdStageRef.current) {
          sdStageRef.current.style.backgroundColor = flip ? '#FFFFFF' : '#000000';
          sdStageRef.current.style.color = flip ? '#000000' : '#FFFFFF';
        }
        if (sdHeadingRef.current) {
          const el = sdHeadingRef.current;
          el.style.transition = 'transform .18s ease-in, opacity .14s ease-in';
          el.style.transform = 'translateY(-24px) scale(0.97)';
          el.style.opacity = '0';
          setTimeout(() => {
            if (!el) return;
            el.textContent = flip ? 'We deliver.' : 'You sell.';
            el.style.transition = 'none';
            el.style.transform = 'translateY(24px) scale(0.97)';
            el.style.opacity = '0';
            void el.offsetHeight;
            el.style.transition = 'transform .18s ease-out, opacity .14s ease-out';
            el.style.transform = 'translateY(0) scale(1)';
            el.style.opacity = '1';
          }, 180);
        }
      }
      const pct = String(Math.round(sdP * 100)).padStart(3, '0') + '%';
      if (pct !== lastPct && pctRef.current) { lastPct = pct; pctRef.current.textContent = pct; }

      /* ─── Phase 2 (0.45→0.65): horizontal slide — track moves left ─── */
      const slideP = Math.max(0, Math.min(1, (p - 0.45) / 0.20));
      const eased = 1 - Math.pow(1 - slideP, 3);
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-eased * 100}vw)`;

      /* ─── Phase 3 (0.60→0.80): black wipe on services — right → left ─── */
      const wipeP = Math.max(0, Math.min(1, (p - 0.60) / 0.20));
      if (wipeRef.current) wipeRef.current.style.clipPath = `inset(0 ${(1 - wipeP) * 100}% 0 0)`;

      /* ─── Phase 4 (0.72→0.84): heading shrinks + moves to top ─── */
      const shrinkP = Math.max(0, Math.min(1, (p - 0.72) / 0.12));
      if (svcHeadingRef.current) {
        const s = 1 - shrinkP * 0.55;
        svcHeadingRef.current.style.transform = `translateY(${shrinkP * -7}vh) scale(${s})`;
        svcHeadingRef.current.style.transformOrigin = 'left top';
      }

      /* ─── Phase 5 (0.76→0.92): cards rise ─── */
      const cardP = Math.max(0, Math.min(1, (p - 0.76) / 0.16));
      if (cardsWrapRef.current) {
        cardsWrapRef.current.style.opacity = String(cardP);
        cardsWrapRef.current.style.transform = `translateY(${(1 - cardP) * 60}px)`;
      }
      cardsRef.current.filter(Boolean).forEach((card, i) => {
        const delay = i * 0.02;
        const local = Math.max(0, Math.min(1, (cardP - delay) / (0.65 - delay)));
        card.style.opacity = String(local);
        card.style.transform = `translateY(${(1 - local) * 24}px)`;
      });

    };

    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', measure);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section ref={sectionRef} style={{ height: '500vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>

        {/* ── Horizontal track: SellDeliver | Services side by side ── */}
        <div ref={trackRef} style={{
          display: 'flex', width: '200vw', height: '100vh',
          willChange: 'transform',
        }}>
          {/* LEFT: SellDeliver */}
          <div ref={sdStageRef} style={{
            width: '100vw', height: '100vh', position: 'relative',
            backgroundColor: '#000', color: '#FFF',
            transition: 'background-color .45s ease, color .45s ease',
            flexShrink: 0,
          }}>
            {/* Wipe bars */}
            <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
              {[0, 1, 2].map(i => (
                <div key={i} ref={barRefs[i]} style={{
                  position: 'absolute', left: 0, right: 0,
                  top: `${10 + i * 26}%`, height: '24%',
                  backgroundColor: '#FFF',
                  transformOrigin: 'left center',
                  transform: 'scaleX(0)',
                  willChange: 'transform',
                  mixBlendMode: 'difference',
                }} />
              ))}
            </div>
            <div style={{
              position: 'absolute', top: 90, left: 32, right: 32,
              display: 'flex', justifyContent: 'space-between',
              fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.22em',
              textTransform: 'uppercase', opacity: .6, mixBlendMode: 'difference', color: '#FFF',
            }}>
              <span>The partnership, in two words</span>
              <span ref={pctRef}>000%</span>
            </div>
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              pointerEvents: 'none',
            }}>
              <h2 ref={sdHeadingRef} style={{
                margin: 0, textAlign: 'center', fontFamily: 'Geist',
                fontSize: 'clamp(72px, 15vw, 220px)', fontWeight: 500,
                letterSpacing: '-.045em', lineHeight: 1.08,
                color: '#FFF', mixBlendMode: 'difference',
              }}>You sell.</h2>
            </div>
            <p style={{
              position: 'absolute', bottom: 90, left: 32, right: 32, margin: 0,
              maxWidth: 620, fontSize: 'clamp(15px, 1.15vw, 18px)', lineHeight: 1.6, opacity: .75,
            }}>
              You own the relationship, the pitch and the invoice. We run production behind
              the scenes — on your templates, in your voice, to your deadlines. Your clients
              never learn our name, and that is the entire point.
            </p>
          </div>

          {/* RIGHT: Services heading — white bg, heading + wipe outside for blend mode */}
          <div style={{
            width: '100vw', height: '100vh', position: 'relative',
            flexShrink: 0,
          }}>
            {/* White background layer */}
            <div style={{
              position: 'absolute', inset: 0,
              background: '#FFF',
              display: 'flex', flexDirection: 'column', justifyContent: 'center',
              padding: '0 6vw',
            }}>
              <div style={{
                fontFamily: 'Geist Mono', fontSize: 11,
                letterSpacing: '0.22em', textTransform: 'uppercase',
                opacity: 0.55, marginBottom: 20,
              }}>What we deliver</div>
              <div style={{
                fontSize: 'clamp(16px, 1.2vw, 20px)', lineHeight: 1.6, opacity: 0.7,
                maxWidth: 420,
              }}>
                Take the whole stack or the two pieces you are missing. Scope is set in a
                simple statement of work, and work begins the day it is signed.
              </div>
            </div>

            {/* Heading — OUTSIDE white panel, above both layers */}
            <h2 ref={svcHeadingRef} style={{
              position: 'absolute', inset: 0,
              display: 'flex', flexDirection: 'column', justifyContent: 'center',
              padding: '0 6vw',
              margin: 0, fontFamily: 'Geist',
              fontSize: 'clamp(52px, 8.5vw, 148px)',
              fontWeight: 600, letterSpacing: '-.045em', lineHeight: 0.92,
              mixBlendMode: 'difference', color: '#FFF',
              zIndex: 3, pointerEvents: 'none',
              willChange: 'transform',
            }}>
              Twelve services,<br /><i style={{ fontWeight: 300 }}>one contract.</i>
            </h2>

            {/* Black wipe — clips right → left, between white bg and heading */}
            <div ref={wipeRef} style={{
              position: 'absolute', inset: 0, background: '#000',
              clipPath: 'inset(0 100% 0 0)',
              willChange: 'clip-path',
              zIndex: 1,
            }} />
          </div>
        </div>

        {/* ── Cards — inside sticky, rise to meet heading during shrink ── */}
        <div ref={cardsWrapRef} style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          background: '#000', color: '#FFF',
          padding: '0 6vw 60px',
          opacity: 0, transform: 'translateY(60px)',
          willChange: 'transform, opacity',
          zIndex: 2,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 24 }}>
            <p style={{
              margin: 0, maxWidth: 420, fontSize: 16, lineHeight: 1.6, opacity: 0.7,
            }}>
              Take the whole stack or the two pieces you are missing. Scope is set in a
              simple statement of work, and work begins the day it is signed.
            </p>
            <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{
              display: 'inline-block', padding: '14px 32px',
              background: '#FFF', color: '#000',
              fontFamily: 'Geist', fontSize: 14, fontWeight: 500,
              letterSpacing: '-.02em', textDecoration: 'none',
              whiteSpace: 'nowrap', flexShrink: 0, cursor: 'pointer',
            }}>Get a quote</a>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
          {items.map(([t, sub], i) => {
            const inverted = (i + Math.floor(i / 4)) % 2 === 0;
            return (
              <div key={t}
                ref={el => cardsRef.current[i] = el}
                style={{
                  background: inverted ? '#FFF' : 'transparent',
                  color: inverted ? '#000' : '#FFF',
                  border: '1px solid #FFF', padding: 22, minHeight: 190,
                  display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
                  opacity: 0, willChange: 'transform, opacity',
                }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.22em', opacity: .6 }}>/{String(i + 1).padStart(2, '0')}</span>
                  <ThreeBar size={20} color="currentColor" />
                </div>
                <div>
                  <div style={{ fontFamily: 'Geist', fontSize: 'clamp(18px,1.6vw,24px)', fontWeight: 500, letterSpacing: '-.02em', lineHeight: 1.1 }}>{t}</div>
                  <div style={{ marginTop: 8, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', opacity: .6 }}>{sub}</div>
                </div>
              </div>
            );
          })}
          </div>
        </div>
      </div>
    </section>
  );
};

/* ═══ 03 · POSITIONING — scroll-linked word reveal ═══ */
const Positioning = () => {
  const sectionRef = useRef(null);
  const wordRefs = useRef([]);
  const [entered, setEntered] = useState(false);

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    const words = wordRefs.current.filter(Boolean);
    if (!words.length) return;

    let raf = 0;
    const measure = () => {
      raf = 0;
      const vh = window.innerHeight;
      for (let i = 0; i < words.length; i++) {
        const r = words[i].getBoundingClientRect();
        const center = r.top + r.height / 2;
        const p = Math.max(0, Math.min(1, 1 - (center - vh * 0.25) / (vh * 0.5)));
        words[i].style.opacity = 0.15 + p * 0.85;
        words[i].style.filter = `blur(${(1 - p) * 3}px)`;
      }
    };

    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };

    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setEntered(true); measure(); }
    }, { threshold: 0.1, rootMargin: '0px 0px -10% 0px' });
    io.observe(section);

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
      io.disconnect();
    };
  }, []);

  const headingLine1 = 'Hiring a specialist for every discipline is';
  const headingLine2 = 'Renting a full bench is';

  return (
    <section ref={sectionRef} style={{ background: '#000', color: '#FFF', padding: '140px 6vw 120px', borderTop: '1px solid #FFF' }}>
      <Kick>Why agencies partner with us</Kick>
      <div style={{
        fontFamily: 'Geist', fontSize: 'clamp(38px, 6.4vw, 104px)',
        fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1.05,
      }}>
        <div>
          {headingLine1.split(' ').map((w, i) => (
            <span key={i} ref={el => wordRefs.current[i] = el} style={{

const QuoteModal = () => {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);

  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
