const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2 }) => (

const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } },
      { threshold: amount, rootMargin: '0px 0px -12% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const useProgress = () => {
  const ref = useRef(null);
  const [p, setP] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const r = el.getBoundingClientRect();
        const vh = window.innerHeight;
        const span = r.height - vh;
        setP(span <= 0
          ? Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height)))
          : Math.max(0, Math.min(1, -r.top / span)));
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    onScroll();
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);
  return [ref, p];
};

const HorizontalProjects = () => {
  const sectionRef = useRef(null);
  const cardsTrackRef = useRef(null);
  const trackRef = useRef(null);
  const cardsHeadingRef = useRef(null);
  const [seen, setSeen] = useState(false);

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0;

    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));

      if (!seen && r.top < vh * 0.7) setSeen(true);

      /* ─── Phase 1 (0→0.45): cards scroll horizontally within panel 1 ─── */
      const cardsP = Math.max(0, Math.min(1, p / 0.45));
      const cardsEased = 1 - Math.pow(1 - cardsP, 3);
      const total = PROJECTS.length;
      const cardsWidth = total * CARD_W + (total - 1) * CARD_GAP;
      const vw = window.innerWidth;
      const maxCardTx = Math.max(0, cardsWidth - (vw * 0.88));
      if (cardsTrackRef.current) {
        cardsTrackRef.current.style.transform = `translateX(${-cardsEased * maxCardTx}px)`;
      }

      /* ─── Phase 2 (0.38→0.52): cards heading fades out ─── */
      const cardFade = Math.max(0, Math.min(1, (p - 0.38) / 0.14));
      if (cardsHeadingRef.current) {
        cardsHeadingRef.current.style.opacity = String(1 - cardFade);
      }

      /* ─── Phase 3 (0.38→0.72): track slides left — overlaps with cards finishing ─── */
      const trackP = Math.max(0, Math.min(1, (p - 0.38) / 0.34));
      const trackEased = 1 - Math.pow(1 - trackP, 3);
      if (trackRef.current) {
        trackRef.current.style.transform = `translateX(${-trackEased * 100}vw)`;
      }
    };

    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', measure);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [seen]);

  return (
    <section ref={sectionRef} style={{ height: '380vh', position: 'relative' }}>
      <div style={{
        position: 'sticky', top: 0, height: '100vh', overflow: 'hidden',
      }}>
        {/* ── Outer track: slides left to reveal case studies panel ── */}
        <div ref={trackRef} style={{
          display: 'flex', width: '200vw', height: '100vh',
          willChange: 'transform',
        }}>
          {/* Panel 1: Client cards */}
          <div style={{
            width: '100vw', height: '100vh', position: 'relative',
            background: '#FFF', color: '#000',
            display: 'flex', flexDirection: 'column', justifyContent: 'center',
            flexShrink: 0, overflow: 'hidden',
          }}>
            <div ref={cardsHeadingRef} style={{
              padding: '0 6vw', marginBottom: 44,
              opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(32px)',
              transition: 'opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1)',
            }}>
              <Kick style={{ color: '#000' }}>Brands we work for</Kick>
              <h2 style={{
                margin: 0, fontFamily: 'Geist',
                fontSize: 'clamp(36px, 5vw, 72px)',
                fontWeight: 500, letterSpacing: '-.035em', lineHeight: 1,
              }}>Our clients.</h2>
              <p style={{
                margin: '16px 0 0', fontFamily: 'Geist', fontSize: 'clamp(14px, 1.1vw, 17px)',
                lineHeight: 1.6, opacity: .5, maxWidth: 480,
              }}>Some of the current and past clients we have delivered product, website, SEO, and marketing projects for.</p>
            </div>
            <div ref={cardsTrackRef} style={{
              display: 'flex', gap: CARD_GAP,
              paddingLeft: '6vw',
              alignItems: 'stretch',
              willChange: 'transform',
            }}>
              {PROJECTS.map((proj, i) => (
                <ProjectCard key={i} project={proj} index={i} seen={seen} />
              ))}
            </div>
          </div>

          {/* Panel 2: Case Studies — text always visible, slides in with panel */}
          <div id="case-studies" style={{
            width: '100vw', height: '100vh',
            background: '#000', color: '#FFF',
            flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{ textAlign: 'center' }}>
              <Kick>Featured work</Kick>
              <h2 style={{
                margin: 0, fontFamily: 'Geist',
                fontSize: 'clamp(64px, 10vw, 180px)',
                fontWeight: 600, letterSpacing: '-.045em', lineHeight: 0.92,
              }}>
                Case <span style={{
                  background: '#FFF', color: '#000', padding: '0 20px',
                  display: 'inline-block', fontStyle: 'italic', fontWeight: 300,
                }}>studies.</span>
              </h2>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

const MPSCase = () => {
  const pinRef = useRef(null);
  const [animP, setAnimP] = useState(0);
  const [page, setPage] = useState(0);
  const [autoPlay, setAutoPlay] = useState(false);
  const pages = ['dashboard', 'fleet', 'analytics', 'reports'];
  const triggered = useRef(false);

  useEffect(() => {
    const el = pinRef.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !triggered.current) {
        triggered.current = true;
        io.disconnect();
        // Animate from 0 to 1 over 800ms
        const duration = 800;
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / duration);
          const eased = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
          setAnimP(eased);
          if (t < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        // Start page cycling after animation completes
        setTimeout(() => setAutoPlay(true), duration);
      }
    }, { threshold: 0.95 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  useEffect(() => {
    if (!autoPlay) return;
    const iv = setInterval(() => setPage(pg => (pg + 1) % pages.length), 2800);
    return () => clearInterval(iv);
  }, [autoPlay]);

  const Wireframe = () => (
    <div style={{ border: '1px solid rgba(255,255,255,.25)', background: '#111', overflow: 'hidden', height: '100%', display: 'flex', flexDirection: 'column' }}>

        <div style={{ width: 8, height: 8, borderRadius: '50%', border: '1px solid rgba(255,255,255,.3)' }} />
        <div style={{ width: 8, height: 8, borderRadius: '50%', border: '1px solid rgba(255,255,255,.3)' }} />
        <div style={{ width: 8, height: 8, borderRadius: '50%', border: '1px solid rgba(255,255,255,.3)' }} />
        <div style={{ flex: 1, height: 14, background: 'rgba(255,255,255,.08)', marginLeft: 8, borderRadius: 2 }} />
        <div style={{ display: 'flex', gap: 6 }}>
          {pages.map((pp, i) => (
            <div key={pp} onClick={() => setPage(i)} style={{
              width: 56, height: 18, borderRadius: 3, cursor: 'pointer',
              background: i === page ? 'rgba(255,255,255,.18)' : 'transparent',
              border: '1px solid rgba(255,255,255,.12)',
              transition: 'background .3s ease',
            }} />
          ))}
        </div>
      </div>
      <div style={{ flex: 1, padding: '16px 20px', position: 'relative', overflow: 'hidden' }}>
        {/* Page 0: Dashboard overview */}
        <div style={{ position: 'absolute', inset: 16, opacity: page === 0 ? 1 : 0, transform: page === 0 ? 'none' : 'translateY(6px)', transition: 'opacity .5s ease, transform .5s ease', pointerEvents: page === 0 ? 'auto' : 'none', display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ height: 9, width: '18%', background: '#FFF', borderRadius: 2 }} />
            <div style={{ height: 8, width: 60, background: 'rgba(255,255,255,.12)', borderRadius: 2 }} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
            {[{w:'45%'},{w:'55%'},{w:'40%'},{w:'50%'}].map((c,j) => (
              <div key={j} style={{ height: 72, border: '1px solid rgba(255,255,255,.18)', borderRadius: 6, padding: '10px 12px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <div style={{ height: 7, width: '55%', background: 'rgba(255,255,255,.12)', borderRadius: 1 }} />
                <div>

  const triggered = useRef(false);

  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !triggered.current) {
        triggered.current = true;
        io.disconnect();
        // Phase 1: split panels (0→800ms)
        setSplitDone(true);
        // Phase 2: icon appears (300ms delay)
        setTimeout(() => setIconDone(true), 300);
        // Phase 3: bars trigger (500ms delay)
        setTimeout(() => setBarsSeen(true), 500);

    }, { threshold: 0.95 });
    io.observe(el);
    return () => io.disconnect();

const QuoteModal = () => {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);

  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div onClick={() => setOpen(false)} style={{
        position: 'absolute', inset: 0, background: 'rgba(0,0,0,.5)',
      }} />
      <div style={{
        position: 'relative', width: '90vw', maxWidth: 640, maxHeight: '90vh',
        overflow: 'auto',
      }}>
        <button onClick={() => setOpen(false)} style={{
          position: 'fixed', top: 20, right: 24, zIndex: 2,
          background: 'none', border: '1px solid #000', color: '#000', cursor: 'pointer',
          fontFamily: 'Geist Mono', fontSize: 16, lineHeight: 1, padding: '6px 10px',
        }}>&#x2715;</button>
        <iframe src="../quote-v1.html" title="Get a Quote" style={{
          width: '100%', height: '85vh', border: 'none',
        }} />
      </div>
    </div>
  );
};
