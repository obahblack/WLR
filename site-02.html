const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2 }) => (

    ))}
  </span>
);

const useReveal = (amount = 0.2) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: amount, rootMargin: '0px 0px -12% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

/* 02 · Sell/Deliver — two terminal panels swap on scroll, progress readout */
const SellDeliver = () => {
  const sectionRef = useRef(null);
  const [p, setP] = useState(0);
  const [pct, setPct] = useState(0);
  const [flip, setFlip] = useState(false);
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0, lastFlip = null;
    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const prog = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));
      setP(prog);
      setPct(Math.round(Math.min(1, prog / 0.45) * 100));
      const f = prog > 0.5;
      if (f !== lastFlip) { lastFlip = f; setFlip(f); }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);

  return (
    <section ref={sectionRef} style={{ height: '420vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', background: flip ? '#FFF' : '#000', color: flip ? '#000' : '#FFF', transition: 'background .5s ease, color .5s ease', display: 'flex', flexDirection: 'column', justifyContent: 'center', overflow: 'hidden' }}>

        </div>
        <div style={{ padding: '0 6vw', maxWidth: 1200 }}>
          <WindowFrame title={flip ? 'we-deliver.sh' : 'you-sell.sh'}>
            <div style={{ padding: 20, fontFamily: 'Geist Mono', fontSize: 13, lineHeight: 1.9 }}>
              <div style={{ opacity: .55 }}>$ cat role.txt</div>
              <div style={{ marginTop: 6 }}>you:   relationship · pitch · invoice</div>
              <div style={{ opacity: .7 }}>us:    production · templates · deadlines</div>
              <div style={{ opacity: .45 }}>client: never learns our name</div>
              <div style={{ marginTop: 14 }}>→ <span style={{ fontFamily: 'Geist', fontWeight: 500, fontSize: 'clamp(26px, 4vw, 52px)', letterSpacing: '-.03em' }}>{flip ? 'We deliver.' : 'You sell.'}</span></div>
            </div>
          </WindowFrame>
        </div>
      </div>
    </section>
  );
};

/* 04 · Positioning — sticky word scrub */
const Positioning = () => {
  const sectionRef = useRef(null);
  const wordRefs = useRef([]);
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    const words = wordRefs.current.filter(Boolean);
    if (!words.length) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const vh = window.innerHeight;
      for (let i = 0; i < words.length; i++) {
        const r = words[i].getBoundingClientRect();
        const center = r.top + r.height / 2;
        const pr = Math.max(0, Math.min(1, 1 - (center - vh * 0.3) / (vh * 0.5)));
        words[i].style.opacity = 0.15 + pr * 0.85;
      }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  const l1 = 'Hiring a specialist for every discipline is slow and expensive.';
  const l2 = 'Renting a full bench is neither.';
  const renderLine = (line, off) => line.split(' ').map((w, i) => (
    <span key={i} ref={el => wordRefs.current[off + i] = el} style={{ display: 'inline-block', opacity: 0.15, marginRight: '0.28em' }}>{w}</span>
  ));
  return (
    <section ref={sectionRef} style={{ background: '#000', color: '#FFF', padding: '150px 6vw', borderTop: '1px solid #FFF' }}>
      <div style={{ fontFamily: 'Geist Mono', fontSize: 11, letterSpacing: '.18em', textTransform: 'uppercase', opacity: .6, marginBottom: 16 }}>why agencies partner with us</div>

        <div style={{ marginTop: 14 }}>{renderLine(l2, l1.split(' ').length)}</div>
      </div>
    </section>
  );
};

/* 09 · Big number — scrubbed */
const BigNumber = () => {
  const numRef = useRef(null);
  const [ref] = useReveal(.2);
  useEffect(() => {
    const el = numRef.current;
    if (!el) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const pr = Math.max(0, Math.min(1, (vh - r.top) / (vh * 0.9)));

const HorizontalProjects = () => {
  const sectionRef = useRef(null);
  const cardsTrackRef = useRef(null);
  const trackRef = useRef(null);
  const headingRef = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    let raf = 0;
    const measure = () => {
      raf = 0;
      const r = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const span = r.height - vh;
      const p = span <= 0 ? 0 : Math.max(0, Math.min(1, -r.top / span));
      if (!seen && r.top < vh * 0.7) setSeen(true);
      const cardsP = Math.max(0, Math.min(1, p / 0.45));
      const eased = 1 - Math.pow(1 - cardsP, 3);
      const vw = window.innerWidth;
      const maxTx = Math.max(0, (PROJECTS.length * CARD_W + (PROJECTS.length - 1) * CARD_GAP) - (vw * 0.88));
      if (cardsTrackRef.current) cardsTrackRef.current.style.transform = `translateX(${-eased * maxTx}px)`;
      const fade = Math.max(0, Math.min(1, (p - 0.38) / 0.14));
      if (headingRef.current) headingRef.current.style.opacity = String(1 - fade);
      const trackP = Math.max(0, Math.min(1, (p - 0.38) / 0.34));
      const trackEased = 1 - Math.pow(1 - trackP, 3);
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-trackEased * 100}vw)`;
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(measure); };
    measure();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', measure); if (raf) cancelAnimationFrame(raf); };
  }, [seen]);
  return (
    <section ref={sectionRef} style={{ height: '380vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>
        <div ref={trackRef} style={{ display: 'flex', width: '200vw', height: '100vh', willChange: 'transform' }}>

      <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ marginTop: 40, display: 'inline-flex', alignItems: 'center', gap: 12, padding: '18px 26px', background: '#FFF', color: '#000', cursor: 'pointer', fontFamily: 'Geist Mono', fontSize: 13, letterSpacing: '.18em', textTransform: 'uppercase', textDecoration: 'none' }}>$ quote --now</a>
    </section>
  );
};

const QuoteModal = () => {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);
  if (!open) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div onClick={() => setOpen(false)} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,.6)' }} />
      <div style={{ position: 'relative', width: '90vw', maxWidth: 640, maxHeight: '90vh', overflow: 'auto' }}>
        <button onClick={() => setOpen(false)} style={{ position: 'fixed', top: 20, right: 24, zIndex: 2, background: '#FFF', border: 'none', color: '#000', cursor: 'pointer', fontFamily: 'Geist Mono', fontSize: 14, lineHeight: 1, padding: '8px 12px' }}>ESC ✕</button>
        <iframe src="quote-v1.html" title="Get a Quote" style={{ width: '100%', height: '85vh', border: 'none' }} />
      </div>
    </div>
  );
};

const Footer = () => (
  <footer style={{ background: '#000', color: '#FFF', borderTop: '1px solid #FFF', padding: '40px 6vw 30px' }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 24 }}>
      <div>
        <ThreeBar size={20} color="#FFF" gap={3} />
        <div style={{ marginTop: 12, fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.2em', textTransform: 'uppercase', opacity: .5 }}>© 2026 White Label Resell · est. 2018</div>
      </div>
      <div style={{ display: 'flex', gap: 22, flexWrap: 'wrap', fontFamily: 'Geist Mono', fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase' }}>
        {[['Work','work'],['About','about'],['Team','team']].map(([l, v]) => <a key={v} href="#" onClick={(e) => { e.preventDefault(); navigateTo(v); }} style={{ textDecoration: 'none', opacity: .75 }}>{l}</a>)}
        <a href="#" onClick={(e) => { e.preventDefault(); window.openQuoteModal(); }} style={{ textDecoration: 'none', opacity: .75, cursor: 'pointer' }}>Get a Quote</a>
        <a href="mailto:partners@whitelabelresell.com" style={{ textDecoration: 'none', opacity: .75 }}>partners@whitelabelresell.com</a>
      </div>
    </div>
  </footer>
);

const App = () => {
  const [view, setView] = useState('home');
  useEffect(() => {
    const onNav = (e) => setView(e.detail);
    window.addEventListener('wlr-nav', onNav);
    return () => window.removeEventListener('wlr-nav', onNav);
  }, []);
  return (
    <React.Fragment>
      <QuoteModal />
      <HUD view={view} />
      {view === 'home' && <Home />}
      {view === 'work' && <Work />}
      {view === 'about' && <About />}
      {view === 'team' && <Team />}
      <Footer />
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
