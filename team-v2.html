<script>
const { useState, useEffect, useRef } = React;
const h = React.createElement;

const useReveal = (amount = 0.15) => {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: amount, rootMargin: '0px 0px -12% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [amount]);
  return [ref, seen];
};

const ThreeBar = ({ size = 16, color = 'currentColor', gap = 2, animate = false }) => {
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!animate) return;
    let r;
    const tick = () => { setT(x => x + 0.016); r = requestAnimationFrame(tick); };
    r = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(r);
  }, [animate]);
  const base = [0.66, 1, 0.82];
  const heights = animate ? base.map((hh, i) => 0.4 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.6 + i * 0.7))) : base;
  return h('span', { style: { display: 'inline-flex', alignItems: 'flex-end', gap, height: size } },
    heights.map((hh, i) => h('span', { key: i, style: { width: size * 0.22, height: (hh * 100) + '%', background: color } }))
  );
};

const LinkedInIconBtn = ({ linkedin, size = 22 }) =>

const QuoteButton = ({ dark = false, label = 'Get a quote', style = {} }) =>

const HUD = ({ active = '' }) => {

          [['Work','work-variations/work-v6.html'],['About','about-variations/about-v1.html'],['Team','team-v2.html']].map(([l, href]) =>
            h('a', { key: l, href, style: linkStyle }, l)

      ),
      h('div', null,
        h('h4', { style: { margin: '0 0 24px', fontFamily: 'Geist', fontSize: 18, fontWeight: 600 } }, 'Quick Links'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
          [['Get a Quote','#'],['Blog','#']].map(([l, href]) =>
            h('a', { key: l, href, onClick: l === 'Get a Quote' ? (e) => { e.preventDefault(); window.openQuoteModal(); } : undefined, style: linkStyle }, l)
          )
        )
      ),
      h('div', null,
        h('h4', { style: { margin: '0 0 24px', fontFamily: 'Geist', fontSize: 18, fontWeight: 600 } }, 'Subscribe To Our Newsletter'),
        h('form', { onSubmit: handleSubscribe, style: { display: 'flex' } },
          h('input', { type: 'email', placeholder: 'Email', value: email, onChange: e => setEmail(e.target.value), required: true, style: { flex: 1, padding: '14px 16px', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', borderRight: 'none', color: '#FFF', fontSize: 15, outline: 'none', fontFamily: 'inherit' } }),
          h('button', { type: 'submit', style: { padding: '14px 28px', background: '#FFF', color: '#000', border: '1px solid #FFF', fontSize: 15, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap' } }, subscribed ? 'Subscribed ✓' : 'Subscribe')
        )
      )
    ),
    h('div', { style: { borderTop: '1px solid rgba(255,255,255,0.15)', padding: '24px 0 32px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16 } },
      h('div', { style: { fontSize: 14, opacity: .6 } }, '\u00a9 2026 White Label Resell. All Rights Reserved.'),
      h('div', { style: { display: 'flex', gap: 24 } },
        h('a', { href: '#', style: { color: '#FFF', textDecoration: 'none', fontSize: 14, opacity: .6 } }, 'Terms'),
        h('a', { href: '#', style: { color: '#FFF', textDecoration: 'none', fontSize: 14, opacity: .6 } }, 'Privacy')
      )
    )
  );
};

const teamLeadership = [
  { name: "Christian Clark", role: "Founder", image: "https://i.ibb.co/R4dPk0Yt/Chris.png", linkedin: "https://www.linkedin.com/in/christian-clark-9a352b179/", alt: "Christian Clark — Founder" },

  { name: "Asad Ehsan", role: "Administrator", image: "https://i.ibb.co/BH1wJ0zS/Asad-new.png", linkedin: null, alt: "Asad Ehsan — Administrator", group: "relations" },

  { name: "Anil Raikwar", role: "Analytics Engineer", image: "https://i.ibb.co/fVQNxcsM/Anil.png", linkedin: "https://www.linkedin.com/in/anil-raikwar/", alt: "Anil Raikwar — Analytics Engineer", group: "products" },

  { name: "Toufeek Abdulrauf", role: "Cloud Engineer", image: "https://i.ibb.co/DH6K17mv/Tofe.png", linkedin: "https://www.linkedin.com/in/taofeek-abdulrauf-a95815226/", alt: "Toufeek Abdulrauf — Cloud Engineer", group: "products" },

  { name: "Munir Nadayako", role: "Web Developer", image: "https://i.ibb.co/p6WfNz6v/Munir.png", linkedin: null, alt: "Munir Nadayako — Web Developer", group: "products" },

/* HERO — text left, brand mark right, black with hover inversion */
const BigMark = ({ color = '#FFF' }) => {
  const [ref, seen] = useReveal(0.2);
  const [lit, setLit] = useState(false);
  useEffect(() => { const t = setTimeout(() => setLit(true), 60); return () => clearTimeout(t); }, []);
  return h('div', { ref, style: { height: 'min(50vh, 408px)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: '1.2vw' } },
    [0.7, 1, 0.85].map((hh, i) =>
      h('div', { key: i, style: { width: 'clamp(48px, 6.7vw, 126px)', height: (seen && lit) ? (hh * 100) + '%' : '0%', background: color, transition: 'height 1s cubic-bezier(.2,.8,.2,1) ' + (i * 120) + 'ms' } })
    )
  );
};

const Hero = ({ kick, heading, sub }) => {
  const [ref, seen] = useReveal(0.2);
  const [inv, setInv] = useState(false);
  useEffect(() => {
    const sec = ref.current;
    if (!sec || typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    gsap.registerPlugin(ScrollTrigger);
    const target = document.querySelector('.cardsec');
    if (!target) return;
    const apply = (self) => setInv(self.progress > 0.75);
    const st = ScrollTrigger.create({ trigger: target, start: 'top 60%', end: 'top 45%', onUpdate: apply, onRefresh: apply });
    return () => st.kill();
  }, []);
  const bg = inv ? '#000' : '#FFF';
  const fg = inv ? '#FFF' : '#000';
  return h('section', { ref, style: { minHeight: '800px', background: bg, color: fg, transition: 'background .6s cubic-bezier(.2,.8,.2,1), color .6s', padding: '100px 6vw 60px', display: 'grid', gridTemplateColumns: '1fr 1fr', alignItems: 'center', gap: '4vw' } },
    h('div', { style: { opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(24px)', transition: 'all .8s cubic-bezier(.2,.8,.2,1)' } },
      h(Kick, { style: { opacity: 0.6 } }, kick),
      h('h1', { style: { margin: 0, fontFamily: 'Geist, sans-serif', fontSize: 'clamp(48px, 6.6vw, 112px)', fontWeight: 500, letterSpacing: '-0.04em', lineHeight: 1.04 } }, heading),
      h('p', { style: { margin: '32px 0 0', maxWidth: 480, fontSize: 'clamp(16px, 1.25vw, 19px)', lineHeight: 1.6, opacity: 0.8 } }, sub),
      h('div', { style: { marginTop: 40 } }, h(QuoteButton, { dark: !inv }))
    ),
    h(BigMark, { color: fg })
  );
};

/* CARDS — flat black, no frame, name + icon on opposite ends, white section.
   The section is sealed by a black gate carrying the brand mark (three white
   bars) printed big and centered. Scrubbed to the scrollbar as the section
   scrolls into view: the gate splits down the middle — left half sweeps left,
   right half sweeps right, with an inward zoom — and the rows of cards file up
   from the bottom into their natural slots (normal size, y 72px -> 0,
   opacity 0 -> 1) with a thin rule drawing under each row. No pinning; the
   white section, card sizes and page structure stay intact. */
const Card = ({ member }) => {
  const [hovered, setHovered] = useState(false);
  return h('div', {
    className: 'team-card',
    style: { background: '#000', color: '#FFF', display: 'flex', flexDirection: 'column', cursor: 'default' },
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => setHovered(false),
  },
    h('div', { style: { overflow: 'hidden', aspectRatio: '1 / 1', background: '#111', position: 'relative' } },
      h('img', {
        src: member.image, alt: member.alt, loading: 'lazy',
        style: {
          width: '100%', height: '100%', objectFit: 'cover', display: 'block',
          filter: hovered ? 'grayscale(0%) contrast(1.05)' : 'grayscale(100%) contrast(1.05)',
          transition: 'filter 0.6s cubic-bezier(.2,.8,.2,1), transform 0.6s cubic-bezier(.2,.8,.2,1)',
          transform: hovered ? 'scale(1.04)' : 'scale(1)',
        }
      }),
      h('div', {
        style: {
          position: 'absolute', inset: 0,
          background: 'linear-gradient(to top, rgba(0,0,0,0.25) 0%, transparent 40%)',
          opacity: hovered ? 0 : 1,
          transition: 'opacity 0.5s cubic-bezier(.2,.8,.2,1)',
          pointerEvents: 'none',
        }
      })
    ),
    h('div', { style: { padding: 18 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 } },
        h('div', { style: { fontFamily: 'Geist, sans-serif', fontSize: 'clamp(17px, 1.4vw, 22px)', fontWeight: 500, letterSpacing: '-0.015em', lineHeight: 1.15, color: '#FFF' } }, member.name),
        h(LinkedInIconBtn, { linkedin: member.linkedin, size: 22 })
      ),
      h('div', { style: { marginTop: 6, fontFamily: 'Geist Mono, monospace', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', opacity: 0.7 } }, member.role)
    )
  );
};

const SectionHeading = ({ children }) =>
  h('div', { style: { marginBottom: 32 } },
    h('h2', { style: { margin: 0, fontFamily: 'Geist, sans-serif', fontSize: 'clamp(28px, 3vw, 44px)', fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1.1 } }, children),
    h('div', { style: { marginTop: 12, height: 2, width: 48, background: '#000' } })
  );

const makeRows = (arr) => {
  const rows = [];
  for (let i = 0; i < arr.length; i += 4) rows.push(arr.slice(i, i + 4));
  return rows;
};

/* Gate: two black halves that seal the section, each carrying its own copy of
   the centered brand mark so the logo splits cleanly down the middle when the
   halves part. Default CSS leaves the gate open (halves translated off) so the
   section stays visible without JS / with reduced motion; GSAP closes it. */
const GateHalf = ({ align, logoOffset }) =>
  h('div', { className: 'gate-half ' + align, 'aria-hidden': 'true' },
    h('div', { style: { position: 'absolute', top: '50%', left: logoOffset, width: '200%', height: '55%', transform: 'translateY(-50%)', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '1.2vw' } },
      [0.7, 1, 0.85].map((hh, i) =>
        h('div', { key: i, style: { width: 'clamp(64px, 9vw, 170px)', height: (hh * 100) + '%', background: '#FFF' } })
      )
    )
  );

const Gate = () =>
  h('div', { className: 'gate', 'aria-hidden': 'true' },
    h(GateHalf, { align: 'left', logoOffset: 0 }),
    h(GateHalf, { align: 'right', logoOffset: '-100%' })
  );

const Cards = () => {
  const secRef = useRef(null);
  useEffect(() => {
    const sec = secRef.current;
    if (!sec) return;
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    gsap.registerPlugin(ScrollTrigger);

    const left = sec.querySelector('.gate-half.left');
    const right = sec.querySelector('.gate-half.right');
    const rows = sec.querySelectorAll('.team-row');

    const tl = gsap.timeline({
      defaults: { ease: 'power2.out' },
      scrollTrigger: {
        trigger: sec,
        start: 'top 95%',
        end: 'bottom 45%',
        scrub: 1,
        invalidateOnRefresh: true,
      },
    });

    tl.fromTo(left, { left: 0, xPercent: 0, scale: 1, transformOrigin: 'right center' }, { xPercent: -100, scale: 1.16, ease: 'power3.inOut', duration: 22 }, 0)
      .fromTo(right, { right: 0, xPercent: 0, scale: 1, transformOrigin: 'left center' }, { xPercent: 100, scale: 1.16, ease: 'power3.inOut', duration: 22 }, 0);

    rows.forEach((row, ri) => {
      const cards = row.querySelectorAll('.team-card');
      const rule = row.querySelector('.row-rule');
      const at = 10 + ri * 9;
      tl.fromTo(cards, { y: 72, opacity: 0 }, { y: 0, opacity: 1, stagger: 0.08, duration: 13 }, at);
      if (rule) tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 8 }, at + 3);
    });
    return () => { tl.scrollTrigger && tl.scrollTrigger.kill(); tl.kill(); };
  }, []);

  const leadershipRows = makeRows(teamLeadership);
  const relationsMembers = teamMembers.filter(m => m.group === 'relations');
  const productsMembers = teamMembers.filter(m => m.group === 'products');
  const relationsRows = makeRows(relationsMembers);
  const productsRows = makeRows(productsMembers);

  return h('section', { className: 'cardsec', ref: secRef, style: { position: 'relative', overflow: 'hidden', background: '#FFF', color: '#000', padding: 'clamp(70px, 8vw, 110px) 6vw', borderTop: '1px solid #000' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 48 } },
      h(Kick, { style: { opacity: 0.5, marginBottom: 0 } }, 'The team')
    ),
    h('div', { className: 'cardgrid', style: { gap: 64 } },
      /* Leadership */
      h('div', null,
        h(SectionHeading, null, 'Leadership'),
        leadershipRows.map((row, ri) =>
          h('div', { key: 'l-' + ri, className: 'team-row', style: { gap: 24 } },
            row.map((member) => h(Card, { key: member.name, member }))
          )
        )
      ),
      /* Team Members */
      h('div', null,
        h(SectionHeading, null, 'Team Members'),
        /* Relations */
        h('div', { style: { marginBottom: 48 } },
          h('div', { style: { marginBottom: 24 } },
            h('div', { style: { fontFamily: 'Geist Mono, monospace', fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', opacity: 0.5 } }, 'Relations')
          ),
          relationsRows.map((row, ri) =>
            h('div', { key: 'r-' + ri, className: 'team-row', style: { gap: 24 } },
              row.map((member) => h(Card, { key: member.name, member })),
              ri < relationsRows.length - 1 ? h('div', { className: 'row-rule' }) : null
            )
          )
        ),
        /* Products */
        h('div', null,
          h('div', { style: { marginBottom: 24 } },
            h('div', { style: { fontFamily: 'Geist Mono, monospace', fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', opacity: 0.5 } }, 'Products')
          ),
          productsRows.map((row, ri) =>
            h('div', { key: 'p-' + ri, className: 'team-row', style: { gap: 24 } },
              row.map((member) => h(Card, { key: member.name, member })),
              ri < productsRows.length - 1 ? h('div', { className: 'row-rule' }) : null
            )
          )
        )
      )
    ),
    h(Gate)
  );
};

/* CTA — wireframe monitor mockup beside heading + button, black section */
const Wireframe = () =>
  h('div', { style: { border: '2px solid #FFF', background: '#000', boxShadow: '0 24px 60px rgba(255,255,255,.08)' } },
    h('div', { style: { borderBottom: '1px solid rgba(255,255,255,.3)', padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 8 } },
      [0, 1, 2].map((d) => h('span', { key: d, style: { width: 10, height: 10, borderRadius: '50%', background: '#FFF' } })),
      h('span', { style: { flex: 1, height: 6, background: 'rgba(255,255,255,.15)', marginLeft: 8 } })
    ),
    h('div', { style: { padding: 18 } },
      h('div', { style: { display: 'flex', gap: 12 } },
        h('div', { style: { flex: 1, height: 44, background: 'rgba(255,255,255,.18)' } }),
        h('div', { style: { width: '28%', height: 44, background: 'rgba(255,255,255,.12)' } })
      ),
      [0, 1, 2, 3].map((i) => h('div', { key: i, style: { marginTop: 10, height: 8, background: 'rgba(255,255,255,.16)' } })),
      h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: 10, height: 64, marginTop: 18 } },
        [0.6, 1, 0.8].map((hh, i) => h('div', { key: i, style: { width: 22, height: hh * 64, background: '#FFF' } }))
      )
    )
  );

const CTA = () => {
  const [ref, seen] = useReveal(0.15);
  return h('section', { ref, style: { background: '#000', color: '#FFF', padding: 'clamp(80px, 9vw, 130px) 6vw', borderTop: '1px solid #FFF' } },
    h('div', { className: 'cta2', style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '5vw', alignItems: 'center' } },
      h('div', { style: { opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(20px)', transition: 'all .8s cubic-bezier(.2,.8,.2,1)' } },
        h(Kick, { style: { opacity: 0.5 } }, 'Work with the bench'),
        h('h2', { style: { margin: 0, fontFamily: 'Geist, sans-serif', fontSize: 'clamp(38px, 5vw, 76px)', fontWeight: 500, letterSpacing: '-0.04em', lineHeight: 1.05 } },
          'Tell us about your ', h('i', { style: { fontWeight: 300 } }, 'next project.')
        ),
        h('p', { style: { margin: '20px 0 0', maxWidth: 460, fontSize: 16, lineHeight: 1.6, opacity: 0.7 } }, 'We reply to every enquiry within one business day.'),
        h('div', { style: { marginTop: 36 } }, h(QuoteButton, { dark: false }))
      ),
      h('div', { style: { opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(24px)', transition: 'all .8s cubic-bezier(.2,.8,.2,1) .15s' } },
        h(Wireframe)
      )
    )
  );
};

const QuoteModal = () => {
  const [open, setOpen] = useState(false);

  useEffect(() => {
    window.openQuoteModal = () => setOpen(true);
    window.closeQuoteModal = () => setOpen(false);
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => { delete window.openQuoteModal; delete window.closeQuoteModal; window.removeEventListener('keydown', onKey); };
  }, []);

  if (!open) return null;
  return h('div', { style: { position: 'fixed', inset: 0, zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
    h('div', { onClick: () => setOpen(false), style: { position: 'absolute', inset: 0, background: 'rgba(0,0,0,.5)' } }),
    h('div', { style: { position: 'relative', width: '90vw', maxWidth: 640, maxHeight: '90vh', overflow: 'auto' } },
      h('button', { onClick: () => setOpen(false), style: { position: 'fixed', top: 20, right: 24, zIndex: 2, background: 'none', border: '1px solid #000', color: '#000', cursor: 'pointer', fontFamily: 'Geist Mono', fontSize: 16, lineHeight: 1, padding: '6px 10px' } }, '\u2715'),
      h('iframe', { src: 'quote-v1.html', title: 'Get a Quote', style: { width: '100%', height: '85vh', border: 'none' } })
    )
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(
  h(React.Fragment, null,
    h(QuoteModal),
    h(HUD, { active: 'team' }),
    h(Hero, { kick: 'the team behind white label resell', heading: h('span', null, 'Meet the ', h('i', { style: { fontWeight: 300 } }, 'Team.')), sub: 'A senior bench of strategists, designers, engineers and analysts working quietly behind your brand — planning, building and shipping the work that wins.' }),
    h(Cards),
    h(CTA),
    h(Footer)
  )
);
</script>
</body>
</html>
